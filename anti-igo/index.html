<style>*,*::before,*::after{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>アンチ囲碁</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* 囲碁中継の画面を、盤ごと破壊する。墨・榧・朱の三色、単一の暗いテーマ */
:root{
  --ink:#120e0b;
  --panel:rgba(18,14,11,.86);
  --kaya:#d8aa62;
  --paper:#efe6d4;
  --muted:#a89a84;
  --shu:#c0392b;
  --f-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-ui:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  color-scheme:dark;
}
html,body{height:100%;}
body{background:var(--ink);color:var(--paper);font-family:var(--f-ui);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;}
.layer{position:fixed;inset:0;pointer-events:none;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.layer>*{pointer-events:auto;}
button,.btn{font-family:var(--f-ui);font-weight:700;font-size:16px;border:1px solid var(--kaya);
  background:var(--kaya);color:var(--ink);padding:14px 28px;border-radius:2px;cursor:pointer;letter-spacing:.08em;
  text-decoration:none;display:inline-block;}
button.ghost{background:transparent;color:var(--kaya);}
button:focus-visible,.btn:focus-visible{outline:2px solid var(--paper);outline-offset:3px;}

/* HUD */
#hud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(16px,env(safe-area-inset-left,0px));
  display:flex;align-items:stretch;gap:0;background:var(--panel);border:1px solid rgba(216,170,98,.35);}
#hud .no{background:var(--shu);color:var(--paper);font-family:var(--f-display);font-weight:800;font-size:20px;
  display:grid;place-items:center;padding:6px 12px;}
#hud .who{padding:6px 12px;display:flex;flex-direction:column;justify-content:center;min-width:0;}
#hud .who b{font-family:var(--f-display);font-size:16px;font-weight:800;white-space:nowrap;}
#hud .who small{font-size:11px;color:var(--muted);letter-spacing:.06em;white-space:nowrap;}

#prompt{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 74px);transform:translateX(-50%);
  background:var(--panel);border:1px solid var(--kaya);padding:10px 18px;font-weight:700;font-size:15px;
  white-space:nowrap;animation:pulse 1.4s ease-in-out infinite;pointer-events:none;}
@keyframes pulse{50%{border-color:rgba(216,170,98,.25);}}

/* 実況の字幕 */
#dlg{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  bottom:calc(env(safe-area-inset-bottom,0px) + 16px);max-width:720px;margin:0 auto;
  background:var(--panel);border-top:2px solid var(--kaya);padding:14px 18px 18px;cursor:pointer;}
#dlg .name{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--ink);
  background:var(--kaya);padding:3px 10px;margin-bottom:8px;}
#dlg.opp .name{background:var(--paper);}
#dlg .txt{font-family:var(--f-display);font-weight:600;font-size:18px;line-height:1.7;min-height:3.4em;}
#dlg .next{position:absolute;right:14px;bottom:8px;color:var(--kaya);font-size:12px;animation:blink 1s steps(2) infinite;}
@keyframes blink{50%{opacity:0;}}

/* 字幕の顔アイコン */
#dlg .head{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
#dlg .head .name{margin-bottom:0;}
#dlgFace{width:52px;height:52px;border-radius:50%;object-fit:cover;object-position:50% 20%;
  border:2px solid var(--kaya);background:var(--paper);margin-top:-30px;}

/* 立ち絵 */
#stand{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 120px);
  height:min(46vh,420px);display:flex;align-items:flex-end;justify-content:flex-end;gap:4px;pointer-events:none;max-width:calc(100% - 32px);}
#stand img{height:100%;width:auto;max-width:100%;object-fit:contain;object-position:bottom;
  filter:drop-shadow(0 6px 18px rgba(0,0,0,.6));transition:filter .25s,transform .25s;transform-origin:bottom center;}
#stand.dim img{filter:brightness(.45) drop-shadow(0 6px 18px rgba(0,0,0,.6));transform:scale(.96);}
#stand.crowd{left:max(16px,env(safe-area-inset-left,0px));justify-content:center;height:min(30vh,240px);}
#stand.crowd img{flex:1 1 0;min-width:0;}

/* 会場テロップ */
#telop{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;}
#telop div{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,8vw,52px);color:var(--paper);
  background:var(--panel);border-block:2px solid var(--kaya);padding:14px 32px;letter-spacing:.12em;text-align:center;
  animation:telop 2.2s ease forwards;}
@keyframes telop{0%{opacity:0;letter-spacing:.6em;}20%{opacity:1;letter-spacing:.12em;}80%{opacity:1;}100%{opacity:0;}}

/* 暗転 */
#fin{position:absolute;inset:0;background:#000;display:grid;place-items:center;cursor:pointer;opacity:0;transition:opacity .8s;}
#fin.on{opacity:1;}
#fin div{font-family:var(--f-display);font-weight:800;font-size:clamp(36px,11vw,72px);letter-spacing:.2em;color:var(--paper);}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .5s;}

/* 結果・タイトル・エンディング */
.sheet{position:absolute;inset:0;display:grid;place-items:center;background:rgba(18,14,11,.55);}
.card{background:var(--panel);border:1px solid rgba(216,170,98,.45);padding:28px 26px;text-align:center;
  width:min(100%,420px);position:relative;display:flex;flex-direction:column;gap:14px;align-items:center;}
.card .eyebrow{font-size:12px;letter-spacing:.2em;color:var(--muted);}
.card h2{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,9vw,44px);margin:0;line-height:1.2;text-wrap:balance;}
.card .reason{color:var(--kaya);font-size:15px;}
.seal{position:absolute;top:-22px;right:-10px;width:74px;height:74px;border:3px solid var(--shu);color:var(--shu);
  border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:38px;
  transform:rotate(-12deg);background:rgba(18,14,11,.9);animation:stamp .5s cubic-bezier(.2,1.8,.4,1) both .25s;}
@keyframes stamp{0%{transform:scale(3) rotate(-30deg);opacity:0;}100%{transform:scale(1) rotate(-12deg);opacity:1;}}
.record{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.1em;}

#title{background:linear-gradient(180deg,rgba(18,14,11,.15),rgba(18,14,11,.75));}
#title .wrap{display:flex;flex-direction:column;align-items:center;gap:22px;}
#title h1{writing-mode:vertical-rl;font-family:var(--f-display);font-weight:800;font-size:clamp(64px,19vw,120px);
  margin:0;letter-spacing:.06em;line-height:1;text-shadow:0 6px 30px rgba(0,0,0,.7);}
#title h1 em{font-style:normal;color:var(--shu);}
#title p{margin:0;font-family:var(--f-display);font-size:16px;color:var(--paper);letter-spacing:.15em;text-align:center;line-height:1.9;}
#title .meta{font-family:var(--f-ui);font-size:12px;color:var(--muted);letter-spacing:.2em;}

#notice{background:#000;}
#notice .notice{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;}
#notice .warn{margin:0;color:var(--shu);font-weight:700;letter-spacing:.2em;font-size:16px;}
#notice .big{margin:0 0 10px;font-family:var(--f-display);font-weight:800;font-size:clamp(30px,9vw,46px);letter-spacing:.1em;}
#ending .tweettext{font-family:var(--f-display);font-size:15px;line-height:1.8;background:rgba(239,230,212,.06);
  border:1px dashed rgba(216,170,98,.4);padding:12px 14px;text-align:left;width:100%;box-sizing:border-box;}
#ending .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
#ending .btn{background:#1d9bf0;border-color:#1d9bf0;color:#fff;}
@media (prefers-reduced-motion:reduce){#telop div,.seal,#prompt,#dlg .next{animation:none;}}
</style>

</head>
<body>
<canvas id="gl"></canvas>
<div class="layer" id="ui">
  <div id="hud" hidden><div class="no" id="hudNo">一</div><div class="who"><b id="hudName"></b><small id="hudSub"></small></div></div>
  <div id="prompt" hidden>あなたの手番です　打つ場所を選んでください</div>
  <div id="telop" hidden><div id="telopTxt"></div></div>
  <div id="flash"></div>
  <div id="stand" hidden></div>
  <div id="dlg" hidden><div class="head"><img id="dlgFace" src="img/onesan.png" alt="" hidden><div class="name" id="dlgName"></div></div><div class="txt" id="dlgTxt"></div><div class="next">▼ タップ</div></div>
  <div id="fin" hidden><div id="finTxt"></div></div>

  <div class="sheet" id="notice">
    <div class="wrap notice">
      <p class="warn">※注意</p>
      <p class="big">音が出ます</p>
      <button id="noticeBtn">OK</button>
    </div>
  </div>

  <div class="sheet" id="title" hidden>
    <div class="wrap">
      <h1>アンチ<em>囲碁</em></h1>
      <p>一石で、すべてを終わらせる。</p>
      <button id="startBtn">対局開始</button>
      <div class="meta">全五局　一本道　黒番固定</div>
    </div>
  </div>

  <div class="sheet" id="result" hidden>
    <div class="card">
      <div class="seal">勝</div>
      <div class="eyebrow" id="resEyebrow">第一局　結果</div>
      <h2 id="resMain">黒 中押し勝ち</h2>
      <div class="reason" id="resReason"></div>
      <div class="record" id="resRecord"></div>
      <button id="nextBtn">次の対局へ</button>
    </div>
  </div>

  <div class="sheet" id="ending" hidden>
    <div class="card">
      <div class="seal">完</div>
      <div class="eyebrow">全五局　五戦全勝</div>
      <h2>囲碁、<br>完全に理解した。</h2>
      <div class="tweettext" id="tweetText"></div>
      <div class="row">
        <a class="btn" id="tweetBtn" target="_blank" rel="noopener">Twitterに投稿</a>
        <button class="ghost" id="againBtn">最初から</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const TWEET = '囲碁のルールを完全に理解して、囲碁業界に一石を投じた！囲碁はクソ #unti_igo';

/* ---------- 寸法（1 = 10cm） ---------- */
const W = 4.6, HALF = W / 2, THICK = 1.6, LEG = 0.9, TOP = LEG + THICK;
const N = 19, SP = 0.22, G0 = -SP * 9;
const STONE_R = 0.105, STONE_H = 0.045;
const BIG_R = 3.2, BIG_H = 1.25; // 直径およそ64…いや、気持ちは1m
const pt = (i, j) => [G0 + i * SP, G0 + j * SP];

/* ---------- 対局データ ---------- */
const A = '実況のおねーさん', ana = t => ({ who: 'ana', t }), op = t => ({ who: 'opp', t }), c = (who, t) => ({ who, t });
const CHARS = {
  kawaguchi: { name: '川口', img: 'img/kawaguchi.png' }, hidaka: { name: '日高', img: 'img/hidaka.png' },
  sagimiya: { name: '鷺宮', img: 'img/sagimiya.png' }, arashiyama: { name: '嵐山', img: 'img/arashiyama.png' },
  omiyain: { name: '大宮院', img: 'img/omiyain.png' }, igoronaku: { name: 'イゴーロナク', img: 'img/igoronaku.png' },
  goisagi: { name: 'ゴイサギ', img: 'img/goisagi.png' }, all: { name: 'みんな', crowd: true },
};
const HOSHI = [3, 9, 15];
const tsuruyoku = (() => { // 鶴翼の陣：黒側に向けて翼を開くV字
  const s = []; s.push([9, 5]);
  for (let k = 1; k <= 8; k++) { s.push([9 - k, 5 + Math.round(k * 0.9)]); s.push([9 + k, 5 + Math.round(k * 0.9)]); }
  return s;
})();
const allPoints = (() => { const s = []; for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) s.push([i, j]); return s; })();

const STAGES = [
  { kanji: '一', who: 'kawaguchi', name: '碁会所の主 川口さん', sub: 'アマ五段　六十二歳', venue: '碁会所', power: 1.0,
    intro: [ana('さあ始まりました、町内囲碁大会。実況は私、実況のおねーさんでお送りします。'),
      ana('白番は、この碁会所に通って五十年、川口さんです。'),
      op('わしの碁は堅実そのもの、若いもんにはまだまだ負けんよ。'),
      ana('なお本局は特別ルールにより、白の先番となっております。')],
    move: () => [[15, 3]],
    post: [ana('白、右上の星。基本に忠実な、美しい一手です。'), ana('さあ黒番、あなたの手番です。')],
    after: [ana('……碁盤が、ありません。'), op('わしの、五十年使った榧の碁盤が……。'),
      ana('審判の判定は、黒の中押し勝ち。打つ場所が残っていないため、とのことです。')],
    reason: '碁盤消滅のため' },
  { kanji: '二', who: 'hidaka', name: '院生 日高 瞬', sub: 'プロ候補　十一歳', venue: '県立囲碁センター', power: 1.2,
    intro: [ana('二回戦、相手はプロ試験最年少合格が噂される天才少年です。'),
      op('おじさんに勝ったくらいで、調子乗らないでよね。'),
      op('素人と玄人の違いってやつを見せてあげるよ。')],
    move: () => [[3, 3], [15, 15]],
    post: [ana('二石同時着手！ 見事な手さばき、なんという石効率でしょう！'),
      op('ほら、早く打ちなよ。もう詰んでるけど。')],
    after: [op('……ずるい、そんなのルールブックに書いてない。'),
      ana('期待の天才少年も、発想の真上からの一手には対処できなかったようです。')],
    reason: '盤の物理的消失のため' },
  { kanji: '三', who: 'sagimiya', name: '鷺宮 翼 四段', sub: '新人王　十九歳', venue: '囲碁囲碁ドーム', power: 1.4,
    intro: [ana('三回戦、期待の若手プロ、新人王の鷺宮四段の登場です。'),
      op('二手で驚いているようでは、まだまだ浅いですね。'),
      op('見せてあげましょう、我が鷺宮家に伝わる布石、鶴翼の陣！')],
    move: () => tsuruyoku,
    post: [ana('白、一気に十七子！ 鶴が翼を広げた形です！'),
      ana('解説の先生によると、鷺宮家は戦前からこの手を研究し尽くしているそうです。'),
      op('さあ、どこから来ても包み込んであげるよ。')],
    after: [op('翼が、根元から……。'), ana('一石一鳥！ 飛ぶ鳥を落とす勢い！ 飛行タイプにはストーンエッジ！')],
    reason: '陣形ごと消滅のため' },
  { kanji: '四', who: 'arashiyama', name: '嵐山 富士見 十段', sub: '全冠制覇　人類の頂点', venue: '爆裂！究極囲碁城', power: 1.7,
    intro: [ana('この一戦、この瞬間に立ち会えることを、私は誇りに思います。'),
      ana('この2人が同じ時代を生き、戦う日が来るなど、神が仕組んだ奇跡としか言えないでしょう。'),
      ana('決勝戦、ついに来ました、人類の頂点、嵐山十段です。'),
      op('囲碁とは、陣地を囲う遊びにならず。'),
      op('己が心で石を包む時、石もまた、全てを囲うのじゃ。')],
    move: () => allPoints,
    post: [ana('初手、三百六十一子……盤上に、黒の打つ場所がありません。'),
      ana('これが人類の到達した、囲碁の最終解答です。'),
      op('投了を勧めるぞ、彼我の実力差がわからぬこともあるまい。')],
    after: [op('……打つ場所は、無かったはずじゃ。'),
      ana('場所は無くても、盤はあったんですね。今はもう無いですが。')],
    reason: '盤上三百六十一子、全消滅のため' },
  { kanji: '五', who: 'omiyain', name: '碁聖 大宮院 彩多麻呂の霊', sub: '平安時代　享年不詳', venue: '彼岸・彩の河原', power: 2.2,
    intro: [ana('……信じられません。現世と冥界の交わる瞬間があるだなんて。'),
      ana('生きた時代など関係ない、この試合こそ、人類最強を決める試合です。'),
      op('千年、待っていましたよ。神の一手を打てる者を。'),
      op('私の一手を見せてしんぜましょう。石など、要らぬ。')],
    move: 'whiteboard',
    post: [ana('盤が、白く染まりました！ 盤上すべてが白の地です！'),
      op('盤そのものが私の石。これぞ、神の一手にござります。'),
      op('さらば、最強…否、私がいない時代に生まれただけの、凡夫。'),
      ana('黒番、泣いても笑っても、最後の一手です。')],
    after: [op('おお……これが、真の神の一手……。'),
      op('天晴です。私は生涯、貴方を忘れることはないでしょう。'),
      ana('もう死んでますけどね。')],
    reason: '盤ごと成仏のため' },
];
const EPILOGUE = [
  c('hidaka', 'すごい！ これが…本当の囲碁なんだ！'),
  c('kawaguchi', 'うおお！ 私も、新たな囲碁の可能性を探したいぞお！'),
  c('sagimiya', '素晴らしい！ 囲碁は…自由だァーッ！！'),
  c('arashiyama', '居ても立ってもいられん！ 囲碁するぞ！'),
  c('omiyain', '囲ー碁ッ！ 囲ー碁ッ！！'),
  c('igoronaku', 'イゴーッ♪'),
  c('goisagi', 'イゴーッ！'),
  c('hidaka', 'あっ、イゴーロナクとゴイサギだ。'),
  ana('囲碁も良いですけど、語彙大富豪もいいですね！'),
  c('igoronaku', 'ゴイーッ♪'),
  c('goisagi', 'ゴイーッ！'),
  c('all', '語ー彙ッ！ 語ー彙ッ！ ゴーイッ！ ゴーイッ！'),
];

/* ---------- 音 ---------- */
let ac = null;
function audio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ac && ac.state === 'suspended') ac.resume(); return ac; }
function noiseBuf(sec) { const b = ac.createBuffer(1, ac.sampleRate * sec, ac.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return b; }
function sfxClick() {
  if (!ac) return; const t = ac.currentTime, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noiseBuf(.05); f.type = 'bandpass'; f.frequency.value = 2600 + Math.random() * 800; f.Q.value = 3;
  g.gain.setValueAtTime(.5, t); g.gain.exponentialRampToValueAtTime(.001, t + .05);
  s.connect(f).connect(g).connect(ac.destination); s.start(t);
}
function sfxBeep() {
  if (!ac) return; const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = 'square'; o.frequency.value = 1320; g.gain.setValueAtTime(.08, t); g.gain.exponentialRampToValueAtTime(.001, t + .07);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + .08);
}

    const s = new THREE.Sprite(sMat), a = Math.random() * Math.PI * 2;
    s.position.set(P.x + Math.cos(a) * BIG_R, rnd(.3, 2.5), P.z + Math.sin(a) * BIG_R); s.scale.setScalar(rnd(1, 2)); scene.add(s);
    dust.push({ s, v: new THREE.Vector3(Math.cos(a) * rnd(2, 6), rnd(.5, 2), Math.sin(a) * rnd(2, 6)), life: rnd(2, 3.5), t: 0 });
  }
  ringT = 0; ring.position.x = P.x; ring.position.z = P.z;
  afterTimer = 3.4;
}

function afterTalk() {
  state = 'talk';
  say(STAGES[stageIx].after, showResult);
}
function showResult() {
  state = 'result'; const st = STAGES[stageIx];
  $('resEyebrow').textContent = `第${st.kanji}局　結果`; $('resMain').textContent = '黒 中押し勝ち';
  $('resReason').textContent = `（${st.reason}）`; $('resRecord').textContent = `通算 ${stageIx + 1}勝 0敗`;
  $('nextBtn').textContent = stageIx === STAGES.length - 1 ? '表彰式へ' : '次の対局へ'; $('result').hidden = false;
}
$('nextBtn').addEventListener('click', () => {
  $('result').hidden = true;
  if (stageIx < STAGES.length - 1) startStage(stageIx + 1); else { state = 'talk'; bgmPlay('epilogue'); say(EPILOGUE, finSeq); }
});
function finSeq() {
  state = 'fin'; const f = $('fin'); let step = 0;
  $('finTxt').textContent = '…'; f.hidden = false; requestAnimationFrame(() => f.classList.add('on'));
  f.onclick = () => {
    step++;
    if (step === 1) $('finTxt').textContent = '〜fin〜';
    else { f.onclick = null; f.classList.remove('on'); setTimeout(() => { f.hidden = true; }, 800); showEnding(); }
  };
}
function showEnding() {
  state = 'ending'; $('hud').hidden = true; $('tweetText').textContent = TWEET;
  const here = /github\.io$/.test(location.hostname) ? location.origin + location.pathname : '';
  $('tweetBtn').href = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(TWEET) + (here ? '&url=' + encodeURIComponent(here) : '');
  $('ending').hidden = false;
}
$('againBtn').addEventListener('click', () => { bgmStop('epilogue'); $('ending').hidden = true; startStage(0); });
$('noticeBtn').addEventListener('click', () => {
  audio(); sfxBeep();
  Object.values(BGM).forEach(a => { a.muted = true; const p = a.play(); if (p && p.then) p.then(() => { a.pause(); a.muted = false; a.currentTime = 0; }).catch(() => { a.muted = false; }); else { a.pause(); a.muted = false; } });
  $('notice').hidden = true; $('title').hidden = false;
});
$('startBtn').addEventListener('click', () => { audio(); $('title').hidden = true; startStage(0); });

/* ---------- ループ ---------- */
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last) / 1000); last = now; clock += dt;

  if (oppAnim) {
    while (oppAnim && clock >= oppAnim.next) {
      const [i, j] = oppAnim.pts[oppAnim.k++]; addStone(i, j);
      if (oppAnim.gap > .05 || (oppAnim.sound++ % 6 === 0)) sfxClick();
      oppAnim.next += oppAnim.gap;
      if (oppAnim.k >= oppAnim.pts.length) { oppAnim = null; setTimeout(() => { state = 'talk'; say(STAGES[stageIx].post, toSelect); }, 700); }
    }
  }
  if (state === 'drop' && drop) {
    drop.v += 150 * dt; drop.y -= drop.v * dt; big.position.y = drop.y; big.rotation.y += dt * .6;
    const k = 1 - Math.min(1, (drop.y - TOP) / 40); tele.material.opacity = k * k * .55; tele.scale.setScalar(.4 + k * .6);
    shake = Math.max(shake, k * k * .08);
    if (drop.y - BIG_H <= TOP) { big.position.y = TOP + BIG_H; impact(); }
  }
  if (state === 'impact' || (physOn && state !== 'title')) {
    if (state === 'impact') {
      const since = clock - impactAt;
      timeScale = since < .45 ? .22 : Math.min(1, .22 + (since - .45) * 1.1);
      afterTimer -= dt; if (afterTimer <= 0) afterTalk();
    }
  }
  if (physOn) {
    if (bigBody && bigBody.position.y <= BIG_H + .3) { bigBody.velocity.set(0, 0, 0); bigBody.position.y = BIG_H + .3; }
    world.step(1 / 120, dt * timeScale, 8);
    world.bodies.forEach(b => { const v = b.velocity, s = v.length(); if (s > 60) v.scale(60 / s, v); });
    if (bigBody) big.position.copy(bigBody.position);
    pieces.forEach(p => { if (p.body) { p.mesh.position.copy(p.body.position); p.mesh.quaternion.copy(p.body.quaternion); } });
    legs.forEach(l => { if (l.body) { l.mesh.position.copy(l.body.position); l.mesh.quaternion.copy(l.body.quaternion); } });
    const sdt = dt * timeScale;
    for (let k = 0; k < spl.length; k++) {
      const s = spl[k]; s.v.y -= 32 * sdt; s.p.addScaledVector(s.v, sdt);
      if (s.p.y < .03) { s.p.y = .03; s.v.y *= -.25; s.v.x *= .6; s.v.z *= .6; s.w.multiplyScalar(.6); }
      s.r.x += s.w.x * sdt; s.r.y += s.w.y * sdt; s.r.z += s.w.z * sdt;
      tmpQ.setFromEuler(s.r); tmpM.compose(s.p, tmpQ, s.s); splInst.setMatrixAt(k, tmpM);
    }
    splInst.instanceMatrix.needsUpdate = true;
    dust = dust.filter(d => { d.t += sdt; d.s.position.addScaledVector(d.v, sdt); d.v.multiplyScalar(1 - sdt * 1.2);
      d.s.scale.multiplyScalar(1 + sdt * .9); d.s.material.opacity = .7 * Math.max(0, 1 - d.t / d.life);
      if (d.t > d.life) { scene.remove(d.s); return false; } return true; });
    if (ringT >= 0) { ringT += sdt; const r = .5 + ringT * 22; ring.scale.set(r, r, 1); ring.material.opacity = Math.max(0, .8 - ringT * 1.1); if (ringT > 1) ringT = -1; }
  }
  syncStones();

  // カメラ
  const base = camBase();
  if (state === 'title') orbit += dt * .12;
  else if ((state === 'impact' || state === 'talk' || state === 'result') && physOn) orbit += dt * .06;
  else orbit *= Math.max(0, 1 - dt * 3);
  const pull = physOn ? 1.25 : 1, c = Math.cos(orbit), s = Math.sin(orbit);
  camera.position.set(base.x * c + base.z * s, base.y, -base.x * s + base.z * c).multiplyScalar(pull);
  shake *= Math.max(0, 1 - dt * 3.2);
  if (shake > .001) camera.position.add(new THREE.Vector3((Math.random() - .5), (Math.random() - .5), (Math.random() - .5)).multiplyScalar(shake));
  camera.lookAt(0, physOn ? 1.2 : 1.6, 0);
  renderer.render(scene, camera);
}
buildBoard();
// タイトル画面用に、真面目な序盤の盤面を並べておく
[[3, 15], [15, 3], [15, 15], [2, 5], [16, 9], [9, 16]].forEach(([i, j]) => { const [x, z] = pt(i, j); stones.push({ x, z, born: -1, body: null }); });
wInst.count = stones.length;
requestAnimationFrame(frame);
})();
</script>
