<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>実況！アンチ野球</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Shippori+Mincho+B1:wght@500;700&display=swap">
<style>
/* Layout: ナイター草野球。上から会話ウィンドウ→球場（ドット絵の選手18人）→監督の口から出る言葉（横スクロールの吹き出し）。1カラム、最大520px */
:root{
  --night:#0d1915;
  --turf:#163128;
  --turf-2:#1e4135;
  --line:#2c5546;
  --chalk:#f1ede2;
  --dim:#9bb3a6;
  --clay:#d07a44;
  --led:#ffcc33;
  --red:#ff5d52;
  --ink:#10140f;
  --f-display:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --f-led:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
*{-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{background:var(--night);color:var(--chalk);font-family:var(--f-body);font-size:15px;line-height:1.55}
.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px;display:flex;flex-direction:column;gap:12px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0;letter-spacing:.02em}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--led);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{font-family:var(--f-display);font-size:20px;line-height:1.1}
.logo small{display:block;font-family:var(--f-body);font-size:11px;color:var(--dim);letter-spacing:.15em}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:var(--dim);white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--turf);border-radius:10px;padding:8px 14px;font-weight:700}
.btn:hover{background:var(--turf-2)}
.btn.main{background:var(--led);color:var(--ink);border-color:var(--led);font-family:var(--f-display);font-weight:700;font-size:17px;padding:12px 18px}
.btn.main:disabled{opacity:.4;cursor:not-allowed}
.btn.small{padding:4px 10px;font-size:13px}

/* 編成 */
.lead{color:var(--dim);font-size:14px;margin:0}
.roster{display:flex;flex-direction:column;gap:10px}
.pl{background:var(--turf);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.pl-head{display:flex;gap:8px;align-items:center}
.pl-no{font-family:var(--f-led);color:var(--led);font-size:18px;width:1.6em;flex:none}
.pl-head input{flex:1;min-width:0;background:var(--night);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.pl-head select{background:var(--night);border:1px solid var(--line);border-radius:8px;padding:6px 4px;max-width:9em}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.stat{position:relative;display:flex;align-items:center;justify-content:space-between;gap:4px;background:var(--night);border-radius:8px;padding:6px 10px;min-height:34px;box-sizing:border-box;font-size:12px;color:var(--dim);cursor:pointer}
.stat:hover{background:#13241e}
.stat:focus-within{outline:2px solid var(--led);outline-offset:1px}
.stat select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;margin:0}
.rk{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1}
.g-A{color:#ff5a5a}.g-B{color:#ff9b3d}.g-C{color:#ffd43b}.g-D{color:#5fd68c}.g-E{color:#4fa8ff}.g-F{color:#b682ff}
.pl-row{flex-direction:row;gap:10px;padding:8px 12px 8px 8px}
.pl-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.slot{flex:none;width:34px;border:1.5px dashed var(--line);border-radius:10px;display:flex;align-items:stretch;justify-content:center;padding:3px;box-sizing:border-box}
.slot.over{border-color:var(--led);background:rgba(255,204,51,.08)}
.bd{writing-mode:vertical-rl;text-orientation:upright;background:var(--led);color:var(--ink);font-weight:700;font-size:11px;letter-spacing:.05em;border-radius:7px;padding:8px 3px;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;width:100%;box-sizing:border-box}
.bd.sel{outline:2px solid var(--chalk);outline-offset:2px}
.bd.lifting{opacity:.3}
.bd.ghost{position:fixed;z-index:40;pointer-events:none;width:30px;height:auto;min-height:70px;box-shadow:0 8px 20px rgba(0,0,0,.5);transform:translate(-50%,-50%) rotate(-4deg)}
.edit-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center}

/* 試合 */
.bench{background:var(--turf);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.bench.enemy{background:linear-gradient(var(--turf),var(--night))}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.who{font-family:var(--f-display);font-size:15px}
.board{font-family:var(--f-led);font-size:13px;color:var(--dim);display:flex;gap:10px;align-items:center}
.board b{color:var(--led);font-weight:700;font-size:18px}
.dots{display:flex;gap:5px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--chalk);box-shadow:0 0 6px rgba(255,255,255,.35)}
.dot.out{background:transparent;border:1.5px dashed var(--line);box-shadow:none}
.names{display:flex;flex-wrap:wrap;gap:4px}
.nm{font-size:11px;padding:1px 6px;border-radius:6px;background:var(--night);color:var(--chalk)}
.nm.lost{color:var(--dim);text-decoration:line-through;opacity:.6}
.beasts{display:flex;flex-wrap:wrap;gap:6px;min-height:0}
.beast{background:var(--night);border:1px solid var(--clay);border-radius:10px;padding:4px 8px;font-size:13px;display:flex;gap:6px;align-items:center}
.beast .hp{font-family:var(--f-led);color:var(--clay);letter-spacing:1px}
.beast .stun{font-size:11px;color:var(--red)}
.status{display:flex;flex-wrap:wrap;gap:4px}
.status .chip{color:var(--chalk);border-color:var(--clay)}
.yokoku{border:1px dashed var(--led);border-radius:10px;padding:6px 10px;font-size:14px;display:flex;gap:8px;align-items:baseline}
.yokoku span{font-size:11px;color:var(--led);letter-spacing:.1em;flex:none}
.yokoku strong{font-family:var(--f-display);font-weight:700;font-size:18px}

.telop{background:#060b09;border:1px solid var(--line);border-radius:14px;padding:8px 10px;height:190px;overflow-y:auto;display:flex;flex-direction:column;gap:5px;scroll-behavior:smooth}
.ln{display:flex;gap:8px;align-items:flex-start;font-size:14px;line-height:1.45;opacity:.72}
.ln.new{opacity:1}
.sp{flex:none;font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;margin-top:2px;min-width:3.2em;text-align:center}
.sp.j{background:var(--led);color:var(--ink)}
.sp.k{background:var(--clay);color:var(--ink)}
.sp.u{background:var(--chalk);color:var(--ink)}
.sp.s{background:var(--turf-2);color:var(--chalk)}
.ln p{margin:0;min-width:0}

.voice{display:flex;gap:4px;align-items:center}
.pip{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--led)}
.pip.on{background:var(--led);box-shadow:0 0 8px rgba(255,204,51,.5)}

.words{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 10px}
.word{position:relative;text-align:left;background:var(--chalk);color:var(--ink);border:0;border-radius:14px;padding:9px 11px 10px;display:flex;flex-direction:column;gap:3px;min-height:86px;transition:transform .12s}
.word::after{content:"";position:absolute;left:18px;bottom:-7px;border:7px solid transparent;border-top-color:var(--chalk);border-bottom:0}
.word:hover:not(:disabled){transform:translateY(-2px)}
.word:disabled{opacity:.42;cursor:not-allowed}
.word .w-top{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.word .w-name{font-family:var(--f-display);font-size:18px;line-height:1.2;word-break:keep-all;overflow-wrap:anywhere}
.word .w-cost{font-family:var(--f-led);font-size:13px;color:#7a5a12;flex:none}
.word .w-desc{font-size:12px;line-height:1.4;color:#3a4038}
.word.unknown{background:#e7e1cf}
.word.unknown::after{border-top-color:#e7e1cf}
.word.unknown .w-desc{color:#6b6a5c;font-style:italic}
.word .w-type{font-size:10px;letter-spacing:.1em;color:#7d7a6b}
.endrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.deckinfo{font-size:12px;color:var(--dim)}

/* シート */
.sheet{position:fixed;inset:0;background:rgba(5,10,8,.72);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.sheet-in{background:var(--turf);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;width:100%;max-width:520px;max-height:86%;overflow-y:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
.sheet-in h2{font-size:20px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;background:var(--night);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:700}
.opt:hover{border-color:var(--led)}
.note-item{background:var(--night);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.note-item .row b{font-family:var(--f-display);font-weight:700;font-size:16px}
.note-item p{margin:0;font-size:13px;color:var(--dim)}
.note-item textarea{width:100%;min-height:44px;resize:vertical;background:var(--turf);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px;box-sizing:border-box}
.tag-known{color:var(--led);font-size:11px}
.tag-unk{color:var(--dim);font-size:11px}
.result{font-family:var(--f-display);font-size:34px;line-height:1.15;color:var(--led)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--led);color:var(--ink);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;z-index:30;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.bdg{font-style:normal;font-size:9px;margin-left:4px;padding:0 4px;border-radius:3px;background:var(--led);color:var(--ink);font-weight:700}
.step{font-family:var(--f-display);font-size:16px;margin:0}
.team-in{background:var(--night);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:var(--f-display);font-size:20px;width:100%;box-sizing:border-box}
.team-in::placeholder{color:var(--dim);opacity:.7}
.hint{margin:0;font-size:12px;color:var(--dim)}
.title-wrap{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:16px;padding-block:24px}
.kicker{margin:0;color:var(--led);font-size:13px;letter-spacing:.12em}
.big-logo{font-size:clamp(44px,14vw,72px);line-height:1.05}
.tname{font-family:var(--f-display);font-weight:700;color:var(--chalk)}
.title-btns{display:grid;gap:10px}
.btn.main.alt{background:var(--chalk);border-color:var(--chalk)}
.logo,.big-logo,.who,.word .w-name,.result,.hud-name,.step,.team-in,.pl-no,.badge,.bd{font-weight:700}
.dim{position:fixed;inset:0;background:rgba(4,8,6,.66);z-index:15;cursor:pointer}
.dim.clear{background:transparent}
.app.tut .word:disabled{opacity:1}
.spot{position:fixed;z-index:16;pointer-events:none;border:3px solid var(--led);border-radius:14px;box-shadow:0 0 0 9999px rgba(4,8,6,.74),0 0 18px rgba(255,204,51,.55);transition:left .2s,top .2s,width .2s,height .2s}
.dialog{z-index:17}
.dialog .story-next{opacity:0}
.dialog.waiting{border-color:var(--led);box-shadow:0 0 0 3px rgba(255,204,51,.18)}
.dialog.waiting .story-next{opacity:1;animation:blink .8s steps(2,start) infinite;font-size:16px;right:12px;bottom:4px}
@keyframes blink{to{visibility:hidden}}
.cutin{position:fixed;inset:0;z-index:30;pointer-events:none;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cutin-band{position:absolute;left:0;right:0;top:50%;height:min(46vw,230px);transform:translateY(-50%);background:linear-gradient(90deg,transparent,rgba(4,8,6,.82) 18%,rgba(4,8,6,.82) 82%,transparent);animation:cutband 1.5s ease both}
.cutin-img{position:relative;width:min(88vw,460px);height:auto;max-width:100%;animation:cutslide 1.5s both}
@keyframes cutslide{0%{transform:translateX(110vw);animation-timing-function:cubic-bezier(.15,.8,.3,1)}23%{transform:translateX(0)}70%{transform:translateX(0);animation-timing-function:cubic-bezier(.6,0,.85,.3)}100%{transform:translateX(-110vw)}}
@keyframes cutband{0%{opacity:0}15%{opacity:1}80%{opacity:1}100%{opacity:0}}
@keyframes cutfade{0%,100%{opacity:0}15%,85%{opacity:1}}
@media (prefers-reduced-motion:reduce){.cutin-img{animation:cutfade 1.2s both!important}.cutin-band{animation:cutfade 1.2s both!important}}
.reward{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 7px;padding-bottom:6px}
.reward .word{height:96px;min-height:0;padding:7px 8px 8px;border-radius:11px;gap:2px;overflow:hidden;opacity:.6}
.reward .word .w-top{flex-direction:column;align-items:flex-start;gap:0}
.reward .word .w-name{font-size:16px}
.reward .word .w-desc{font-size:11.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.reward .word.picked{opacity:1;outline:3px solid var(--led);outline-offset:2px}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.share-txt{width:100%;min-height:70px;box-sizing:border-box;background:var(--night);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:13px}
.smash{position:fixed;inset:0;width:100%;height:100%;z-index:32;pointer-events:none}
.dialog p.big{font-size:34px;line-height:1.15;font-weight:700;color:var(--led);letter-spacing:.02em;-webkit-line-clamp:2}
.choices{position:fixed;left:50%;transform:translateX(-50%);z-index:18;display:flex;gap:12px;width:min(88vw,420px)}
.choices .btn{flex:1}
.chapter{position:fixed;inset:0;z-index:45;background:#000;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .7s ease;cursor:pointer;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.chapter.on{opacity:1}
.chapter.out{opacity:0}
.ch-in{display:flex;flex-direction:column;align-items:center;gap:18px;color:#fff;font-family:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;text-align:center;opacity:0;transform:translateY(6px);transition:opacity 1s ease .6s,transform 1s ease .6s}
.chapter.on .ch-in{opacity:1;transform:none}
.ch-title{margin:0;font-size:clamp(26px,8vw,38px);font-weight:700;letter-spacing:.12em}
.ch-sub{margin:0;font-size:clamp(15px,4.4vw,19px);font-weight:500;letter-spacing:.08em;opacity:.9}
.dialog p.inner{color:var(--dim);font-style:italic}
.face.kid img{object-fit:contain;padding:9px 11px 5px;box-sizing:border-box}
.choices .btn.long{font-size:13px;line-height:1.4;padding:10px 12px}
.app.ending .handbar,.app.ending .words,.app.ending .hud{display:none!important}
.fwhite{position:absolute;inset:0;background:#fff;opacity:0;transition:opacity 1.3s ease;pointer-events:none;z-index:3}
.swhite,.sblack{position:fixed;inset:0;opacity:0;pointer-events:none;z-index:44;transition:opacity 1.5s ease}
.swhite{background:#fff}.sblack{background:#000}
.fwhite.on,.swhite.on,.sblack.on{opacity:1}
.fin{position:fixed;inset:0;z-index:20;background:#000;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.fin-word{margin:0;font-family:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;font-size:56px;font-weight:500;letter-spacing:.2em}
.fin-btns{width:min(88vw,360px)}
.uni-prev{display:flex;justify-content:center}
.uni-prev canvas{width:220px;max-width:100%;height:auto;border-radius:14px;border:1px solid var(--line);image-rendering:pixelated}
.uni-row{display:flex;flex-direction:column;gap:6px}
.swatches{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.sw{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--turf);border:1.5px solid var(--line);border-radius:10px;padding:6px 2px}
.sw .dot{width:26px;height:26px;border-radius:50%;background:var(--c);border:2px solid rgba(0,0,0,.35)}
.sw .nm{font-size:11px;color:var(--dim);white-space:nowrap}
.sw.on{border-color:var(--led);background:var(--turf-2)}
.sw.on .nm{color:var(--chalk);font-weight:700}
/* 試合・ストーリー（全画面） */
.app.full{height:100%;box-sizing:border-box;padding-block:8px;gap:8px;overflow:hidden}
.dialog{position:relative;flex:none;height:114px;box-sizing:border-box;background:rgba(6,11,9,.92);border:1.5px solid var(--chalk);border-radius:14px;padding:26px 14px 12px;margin-top:30px;display:flex;flex-direction:column;gap:4px;cursor:pointer}
.dialog p{margin:0;font-size:15px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.dhead{position:absolute;top:-30px;left:10px;display:flex;align-items:flex-end;gap:8px;pointer-events:none}
.dialog .story-who{position:static;margin:0 0 6px}
.face{flex:none;width:52px;height:52px;border-radius:50%;overflow:hidden;border:2px solid var(--chalk);background:var(--turf);box-sizing:border-box}
.face img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.face.px{background:#2a5a46}
.face.facek img{object-fit:cover;object-position:50% 50%;background:#cfe3f2}
.face.facej img{object-fit:contain;object-position:50% 100%;background:#cfe3f2}
.face.px img{image-rendering:pixelated;object-position:50% 0}
.story-who.sp-tc,.story-who.sp-ob,.story-who.sp-sy,.story-who.sp-my{background:#f0a050}
.story-who.sp-qq,.story-who.sp-kid{background:var(--chalk)}
.story-who.sp-br{background:var(--chalk)}
.story-who.sp-k{background:var(--clay)}
.story-who.sp-u{background:var(--chalk)}
.story-who.sp-s{background:var(--turf-2);color:var(--chalk)}
.say-in{animation:sayin .18s ease-out}
@keyframes sayin{from{opacity:0;transform:translateY(3px)}}
.fieldwrap{position:relative;flex:1;min-height:120px;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.fieldwrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.fieldwrap canvas.fx{z-index:16;pointer-events:none}
.hud{position:absolute;left:6px;right:6px;display:flex;justify-content:space-between;align-items:flex-start;gap:6px;pointer-events:none}
.hud-top{top:6px}.hud-bot{bottom:6px;align-items:flex-end}
.hud-card{background:rgba(6,11,9,.72);border-radius:10px;padding:4px 8px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;max-width:62%;font-size:12px}
.hud-name{font-family:var(--f-display);font-size:13px}
.hud .yokoku{flex-direction:column;align-items:flex-end;gap:0;border:1px dashed var(--led);max-width:40%}
.hud .yokoku strong{font-size:15px;line-height:1.2;text-align:right}
.hud .status .chip{font-size:10px;padding:0 6px}
.handbar{flex:none;display:flex;align-items:center;gap:8px}
.handbar .deckinfo{flex:1;text-align:center}
.handbar .btn.main{padding:8px 14px;font-size:15px}
.app.full .words{flex:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,92px);gap:12px 7px;padding:0 0 8px}
.app.full .word{min-height:0;height:92px;padding:7px 8px 8px;border-radius:11px;gap:2px;overflow:hidden}
.app.full .word::after{left:12px;bottom:-6px;border-width:6px}
.app.full .word .w-name{font-size:16px;line-height:1.2}
.app.full .word .w-cost{font-size:12px}
.app.full .word .w-top{flex-direction:column;align-items:flex-start;gap:0}
.app.full .word .w-desc{font-size:11.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.app.full .nohand{grid-column:1/-1;align-self:center;text-align:center}
.story{position:relative;isolation:isolate;height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:12px;cursor:pointer;border-radius:16px;overflow:hidden;padding:12px}
.story-sky{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 115%,#2a5a46 0 38%,transparent 39%),linear-gradient(#0a1411,#163128 70%,#1d3b2c);z-index:-1}
.story-top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.story-box{position:relative;background:rgba(6,11,9,.88);border:1.5px solid var(--chalk);border-radius:14px;padding:16px 16px 22px;min-height:120px;display:flex;flex-direction:column;gap:6px}
.story-box.narr{border-style:dashed;border-color:var(--dim)}
.story-box.narr p{color:var(--dim);font-style:italic}
.story-box p{margin:0;font-size:17px;line-height:1.7}
.story-who{align-self:flex-start;background:var(--led);color:var(--ink);font-weight:700;font-size:13px;padding:2px 10px;border-radius:6px;margin-top:-28px}
.story-next{position:absolute;right:14px;bottom:6px;color:var(--led);font-size:12px;animation:bob 1s infinite}
.story-btns{display:grid;gap:10px}
@keyframes bob{50%{transform:translateY(3px)}}
/* 角はすべて直角（顔アイコンと色見本だけ丸） */
*:not(.face):not(.dot),*::before,*::after{border-radius:0!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

let UID=1;
async function summon(side,key){se('summon');const b=BEASTS[key];side.summons.push({uid:UID++,key,name:b.name,hp:b.hp,max:b.hp,stun:0,age:0});await say('j',b.line);await say('k',b.talk);render()}

/* ---------- 状態 ---------- */
const S={screen:'title',team:loadTeam(),p:null,c:null,turn:null,busy:false,ended:false,log:[],newFrom:0,winner:null};
function newSide(players,badges,cpu,label,deck){return{cpu,label,team:players.map((p,i)=>({...p,stats:{...p.stats},roles:rolesOf(badges,i)})),alive:[],lost:[],summons:[],hand:[],deck:shuffle((deck||Object.keys(W)).slice()),discard:[],voice:3,maxVoice:3,st:{},announce:null,played:0,lastFizzle:0}}
const opp=s=>s===S.p?S.c:S.p;

const HAND_MAX=6;
function draw(side,n){for(let i=0;i<n;i++){if(side.hand.length>=HAND_MAX)return;if(!side.deck.length){side.deck=shuffle(side.discard);side.discard=[]}if(!side.deck.length)return;side.hand.push(side.deck.pop())}}

const FACE_PX={};
function pxFace(k){if(!FACE_PX[k])FACE_PX[k]=spriteCanvas(k,0).toDataURL();return FACE_PX[k]}
function speakerName(who){return who==='tp'?S.p.label:who==='tc'?S.c.label:SPK[who]}
function faceHtml(who){
 if(who==='j')return `<span class="face facej"><img src="${FACE_J}" alt=""></span>`;
 if(who==='k')return `<span class="face facek"><img src="${FACE_K}" alt=""></span>`;
 if(who==='kid')return `<span class="face px kid"><img src="${pxFace('p')}" alt=""></span>`;
 if(who==='ob'||who==='sy'||who==='my')return `<span class="face px"><img src="${pxFace('c')}" alt=""></span>`;
 if(who==='tp'||who==='tc')return `<span class="face px"><img src="${pxFace(who==='tp'?'p':'c')}" alt=""></span>`;

function cutIn(k){
 se('cutin');
 return new Promise(res=>{
  if(S.screen!=='battle'){res();return}
  const el=document.createElement('div');el.className='cutin';
  el.innerHTML=`<div class="cutin-band"></div><img class="cutin-img" src="${CUT_IMG[k]}" alt="${k==='p'?'あなたの番！':'相手の番！'}">`;
  document.body.appendChild(el);
  const img=el.querySelector('.cutin-img');
  let done=false;const fin=()=>{if(done)return;done=true;el.remove();res()};
  img.addEventListener('animationend',e=>{if(e.animationName==='cutslide'||e.animationName==='cutfade')fin()});
  setTimeout(fin,2200);
 });
}
let sayNext=null;
let waitOffT=null;
function setWaiting(on){clearTimeout(waitOffT);const apply=v=>{const d=$('#dim');if(d)d.hidden=!v;const t=$('#telop');if(t)t.classList.toggle('waiting',v)};if(on)apply(true);else waitOffT=setTimeout(()=>apply(false),180)}
let SPOT=null;
function placeSpot(){
 const sp=$('#spot'),d=$('#dim');if(!sp)return;
 const el=SPOT&&document.querySelector(SPOT);
 if(!el){sp.hidden=true;if(d)d.classList.remove('clear');return}
 const r=el.getBoundingClientRect(),pad=5;
 Object.assign(sp.style,{left:(r.left-pad)+'px',top:(r.top-pad)+'px',width:(r.width+pad*2)+'px',height:(r.height+pad*2)+'px'});
 sp.hidden=false;if(d)d.classList.add('clear');
}
window.addEventListener('resize',placeSpot);
function punct(t){t=String(t).trimEnd();return /[。！？!?、）」』]$/.test(t)?t:t+'。'}
function ask(who,text,choices){
 text=punct(text);S.log.push({who,text,big:false});renderLog();
 return choose(choices);
}
function choose(choices){

 }

async function attack(x,n,opt){
 opt=opt||{};
 const total=n+(x.extra||0);
 let choice=null;
 for(let i=0;i<total&&!S.ended;i++){
  const o=x.op;let target={kind:'player'};
  if(opt.only!=='players'&&o.summons.length){
   if(choice&&choice.kind==='summon'&&o.summons.some(z=>z.uid===choice.uid))target=choice;
   else if(choice&&choice.kind==='player')target=choice;
   else if(x.me.cpu){target=chance(.4)?{kind:'summon',uid:pick(o.summons).uid}:{kind:'player'};}
   else{choice=await askTarget(o,total-i);target=choice}
  }
  await hit(x.me,o,target);
 }
}

  const x={me:side,op:opp(side),extra:0};

  const twice=side.st.mangai&&w!=='満塁';
  if(twice)side.st.mangai=false;
  ok=await W[w].fx(x);
  if(twice&&!S.ended){await say('j','満塁の効果で、もう一回！');const o2=await W[w].fx(x);ok=ok||o2}
 }

function startTurn(side){
 S.turn=side;
 side.st.kanpu=false;side.st.keien=false;
 side.voice=Math.max(0,side.maxVoice-(side.st.penalty||0));side.st.penalty=0;
 if(side.st.rally&&side.alive.length<=3)side.voice+=2;
 side.st.chinActive=!!side.st.chin;side.st.chin=false;
 side.played=0;side.lastFizzle=0;
 draw(side,1);
}
async function beastsAct(side){
 for(const s of side.summons.slice()){
  if(S.ended)return;
  if(!side.summons.includes(s))continue;
  if(s.stun>0){s.stun--;await say('j',`${s.name}は封じられていて動けません`);continue}
  const b=BEASTS[s.key];
  const reps=side.st.guts?2:1;
  for(let r=0;r<reps&&!S.ended;r++)await b.act(side,s);
  await flushFirstKO();
  if(s.key==='koi'&&side.summons.includes(s)){s.age++;if(s.age>=3){s.key='ryu';s.name='ドラゴン';s.hp=3;s.max=3;{const fb=F.beasts.get(s.uid);if(fb)fb.evo=90;se('summon')}render();await say('j','鯉が……滝を登って、ドラゴンになりました！！');await say('k','滝、どこにあったんでしょうね')}}
 }
 side.st.guts=false;
 render();
}
function useful(side,w){
 const o=opp(side);
 if(['サヨナラ','ガッツポーズ'].includes(w)&&!side.summons.length)return false;
 if(['挟殺','封殺'].includes(w)&&!o.summons.length)return false;
 if(w==='タイムリー'&&side.played===0)return false;
 if(w==='ドンマイ'&&!side.lastFizzle)return false;
 if(w==='盗塁'&&!o.hand.length)return false;
 if(['犠打','犠飛','デッドボール','乱闘','胴上げ'].includes(w)&&side.alive.length<=2)return false;
 if(w==='人的補償'&&side.alive.length<=3)return false;
 if(w==='Time'&&side.hand.length>=HAND_MAX)return false;
 if(w==='Rally cap'&&side.alive.length>5)return false;
 return true;
}
const BOOST={'タイム':1,'声出していこう':2};
function boostPotential(side,except){let b=0;const seen=side.hand.slice();const i=seen.indexOf(except);if(i>=0)seen.splice(i,1);seen.forEach(w=>{if(BOOST[w])b+=BOOST[w]});if(seen.includes('Heater'))b+=0;return b}
async function cpuBoostFor(c,w){
 let g=0;
 while(!S.ended&&g++<4&&c.hand.includes(w)&&costOf(c,w)>c.voice){
  const bi=c.hand.findIndex(x=>BOOST[x]&&x!==w&&costOf(c,x)<=c.voice);
  if(bi>=0){await shout(c,bi);continue}
  const hi=c.hand.indexOf('Heater');
  if(hi>=0&&w!=='Heater'&&costOf(c,'Heater')<=c.voice&&!c.st.heater&&costOf(c,w)-1<=c.voice-1){await shout(c,hi);continue}
  break;
 }
}
function pickAnnounce(side){
 const cands=side.hand.filter(w=>W[w].c<=side.maxVoice+boostPotential(side,w));
 if(!cands.length){side.announce=null;return}
 const strong=cands.filter(w=>ATTACKERS.has(w)||W[w].t==='召');
 side.announce=pick(strong.length&&chance(.75)?strong:cands);
}
async function cpuTurn(first){
 const c=S.c;
 startTurn(c);render();
 if(!first){await say('j',`${c.label}の番です`);await cutIn('c');}
 if(c.announce){
  const i=c.hand.indexOf(c.announce);
  if(i>=0&&costOf(c,c.announce)>c.voice)await cpuBoostFor(c,c.announce);
  const j=c.hand.indexOf(c.announce);
  if(i<0)await say('j',`${c.label}の監督、予告していた『${c.announce}』を忘れたようです`);
  else if(j<0){}
  else if(costOf(c,c.announce)>c.voice)await say('j',`${c.label}の監督、声量が足りず『${c.announce}』が出てきません`);
  else await shout(c,j);
 }
 let guard=((first&&S.run.stage===0)||STAGES[S.run.stage].oneShout||c.st.chinActive)?99:0;
 while(!S.ended&&guard++<4){
  const opts=c.hand.map((w,i)=>({w,i})).filter(o=>costOf(c,o.w)<=c.voice&&useful(c,o.w));
  if(!opts.length)break;
  const heavy=opts.filter(o=>!BOOST[o.w]).sort((a,b)=>W[b.w].c-W[a.w].c);
  const o=heavy.length&&chance(.6)?heavy[0]:pick(opts);await shout(c,o.i);
 }
 if(S.ended)return;
 await beastsAct(c);
 if(S.ended)return;
 pickAnnounce(c);
 if(c.announce)await say('j',`${c.label}の監督、次は『${c.announce}』を叫ぶ構えです`);
 else await say('j',`${c.label}の監督、次に何を叫ぶか決めかねています`);
 startTurn(S.p);render();
 if(first&&S.run.stage===0)await tutorial();
 await say('j',`${S.p.label}の番です`);await cutIn('p');
 S.busy=false;render();
}

function playStory(lines,onEnd,buttons){lines=lines.map(l=>({...l,text:punct(l.text)}));S.story={lines,i:0,onEnd,buttons};S.screen='story';render()}
function renderStory(app){
 const st=S.story;const done=st.i>=st.lines.length;
 const ln=st.lines[Math.min(st.i,st.lines.length-1)];
 let h=`<div class="story" id="story"><div class="story-sky"></div><div class="story-top"><span class="chip">${S.c?esc(S.p.label)+' 対 '+esc(S.c.label):''}</span>${done?'':'<button class="btn small" id="skip">スキップ</button>'}</div>`;
 h+=`<div class="story-box${ln.who?'':' narr'}">${ln.who?`<span class="story-who">${esc(ln.who)}</span>`:''}<p>${esc(ln.text)}</p>${done?'':'<span class="story-next" aria-hidden="true">▼</span>'}</div>`;
 if(done&&st.buttons)h+=`<div class="story-btns">${st.buttons.map((b,i)=>`<button class="btn main${b.main?'':' alt'}" data-b="${i}">${esc(b.label)}</button>`).join('')}</div>`;
 h+=`</div>`;
 app.innerHTML=h;
 const next=()=>{if(st.i<st.lines.length-1){st.i++;renderStory(app)}else if(!done){st.i=st.lines.length;if(st.onEnd)st.onEnd();else renderStory(app)}};
 $('#story').onclick=e=>{if(e.target.closest('button'))return;next()};
 const sk=$('#skip');if(sk)sk.onclick=()=>{st.i=st.lines.length-1;next()};
 app.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>st.buttons[+b.dataset.b].go());
}

 const big=z.key==='giant'||z.key==='dragon'||z.key==='demon'||z.key==='ryu',sz=(big?76:60)*b.born,S2=sz*sp.width/BS,sc=S2/sp.width;
 const cx=b.x*F.w,cy=b.y*F.h,x0=cx-S2/2,y0=cy-S2/2;

 for(let y=0;y<sp.height;y+=st)for(let x=0;x<sp.width;x+=st){const i=(y*sp.width+x)*4;if(d[i+3]<128)continue;
  const px=x0+x*sc,py=y0+y*sc,dx=px-cx,dy=py-cy,dist=Math.hypot(dx,dy)||1,v=1+Math.random()*3;

 c.beginPath();c.moveTo(X(H.x)-5,Y(H.y)-3);c.lineTo(X(H.x)+5,Y(H.y)-3);c.lineTo(X(H.x)+5,Y(H.y)+1);c.lineTo(X(H.x),Y(H.y)+5);c.lineTo(X(H.x)-5,Y(H.y)+1);c.closePath();c.fill();

}

function beastBase(k){
 if(BEAST_BASE[k])return BEAST_BASE[k];
 const cv=document.createElement('canvas');cv.width=BS;cv.height=BS;const c=cv.getContext('2d');
 const im=BEAST_IMGS[k];
 if(im){const s=Math.min(BS/im.width,BS/im.height),w=im.width*s,h=im.height*s;c.imageSmoothingEnabled=true;c.imageSmoothingQuality='high';c.drawImage(im,(BS-w)/2,(BS-h)/2,w,h);return BEAST_BASE[k]=cv}
 const f=BEAST_DRAW[k];if(!f)return null;
 c.scale(2,2);
 const E=(x,y,rx,ry,col,rot)=>{c.fillStyle=col;c.beginPath();c.ellipse(x,y,rx,ry,rot||0,0,Math.PI*2);c.fill()};
 const P=(pts,col)=>{c.fillStyle=col;c.beginPath();pts.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.closePath();c.fill()};
 const L=(x1,y1,x2,y2,w,col)=>{c.strokeStyle=col;c.lineWidth=w;c.lineCap='round';c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke()};
 const R=(x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(x,y,w,h)};
 f(c,E,P,L,R);
 return BEAST_IMGS[k]?null:(BEAST_BASE[k+'_fallback']=cv);
}
function tint(src,col){const t=document.createElement('canvas');t.width=src.width;t.height=src.height;const x=t.getContext('2d');x.drawImage(src,0,0);x.globalCompositeOperation='source-in';x.fillStyle=col;x.fillRect(0,0,t.width,t.height);return t}
function beastSprite(k,team){
 const col=team==='p'?PAL.p.u:'#f0a050',key=k+team+col;if(BEAST_OUT[key])return BEAST_OUT[key];const b=beastBase(k);if(!b)return null;
 const o=7,ii=4,t=tint(b,col),dk=tint(b,'#0b120f');
 const cv=document.createElement('canvas');cv.width=b.width+o*2+2;cv.height=b.height+o*2+2;const c=cv.getContext('2d');
 for(let dy=-o;dy<=o;dy++)for(let dx=-o;dx<=o;dx++){if(dx*dx+dy*dy>o*o+1)continue;c.drawImage(dk,o+dx+1,o+dy+1)}
 for(let dy=-ii;dy<=ii;dy++)for(let dx=-ii;dx<=ii;dx++){if(dx*dx+dy*dy>ii*ii+1)continue;c.drawImage(t,o+dx+1,o+dy+1)}
 c.drawImage(b,o+1,o+1);
 const done=!!BEAST_IMGS[k]||!BEAST_SRC[k];if(done){BEAST_OUT[key]=cv;BEAST_OUT[k+team+'w']=tint(b,'#ffffff')}else BEAST_OUT['_w'+k]=tint(b,'#ffffff');return cv;
}

}
function openNote(){
 const seen=Object.keys(NOTE.seen).filter(w=>W[w]);
 let h=`<div class="row"><h2>監督ノート</h2><button class="btn small" id="noteClose">閉じる</button></div>`;
 h+=`<p class="lead">一度見た言葉が並びます。意味は自分で書いてください。書いた内容は、試合中の言葉の吹き出しにも出ます。</p>`;
 if(!seen.length)h+=`<p class="lead">まだ何も書かれていません。試合で言葉を見かけると、ここに増えていきます。</p>`;
 seen.forEach((w,i)=>{h+=`<div class="note-item"><div class="row"><b>${esc(w)}</b><span class="tag-unk">声量${W[w].c}</span></div><textarea id="memo_${i}" data-w="${esc(w)}" placeholder="叫んだら何が起きたか、メモしておく">${esc(NOTE.memo[w]||'')}</textarea></div>`});
 if(seen.length)h+=`<button class="btn small" id="noteReset" style="align-self:flex-start">ノートを白紙に戻す</button>`;
 openSheet(h);
 $('#sheetIn').onclick=null;
 $('#noteClose').onclick=()=>{closeSheet();render()};
 $('#sheetIn').querySelectorAll('textarea').forEach(t=>t.oninput=()=>{const v=t.value.trim();if(v)NOTE.memo[t.dataset.w]=v;else delete NOTE.memo[t.dataset.w];save(KEY_NOTE,NOTE)});
 const rb=$('#noteReset');let armed=false;
 if(rb)rb.onclick=e=>{if(!armed){armed=true;e.target.textContent='本当に白紙にする？ もう一度押す';return}NOTE.known={};NOTE.memo={};NOTE.seen={};save(KEY_NOTE,NOTE);openNote()};
}


render();
})();
</script>
</body>
</html>
