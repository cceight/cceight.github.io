<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>わんわん とびいし</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yomogi&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ffffff;
  --grid:#d3e4f0;
  --blue:#2a4ea0;
  --red:#d43d3d;
  --ink:#2b2b2b;
  --font:"Yomogi","Zen Kurenaido","Klee One",cursive,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--paper);overflow:hidden;
  font-family:var(--font);color:var(--blue);user-select:none;-webkit-user-select:none;touch-action:manipulation}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
.layer{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;pointer-events:none}
.layer.on{display:flex}
.credit{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 10px);text-align:center;
  font-size:12px;line-height:1.5;color:#6b7a99;pointer-events:none}
.credit{background:transparent}
#loading{justify-content:center;background:#fff}
#loading .loadtxt{font-size:24px;color:var(--blue);transform:rotate(-3deg)}
#loading .loadtxt span{display:inline-block;animation:dot 1s infinite}
#loading .loadtxt span:nth-child(2){animation-delay:.15s}
#loading .loadtxt span:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
#title.on,#over.on,#pause.on{background:rgba(255,255,255,.55)}
.layer > *{pointer-events:auto}

/* hand-drawn button */
.btn{font-family:var(--font);color:var(--blue);background:#fff;border:2.5px solid var(--blue);
  border-radius:255px 18px 225px 18px/18px 225px 18px 255px;padding:10px 18px;font-size:20px;line-height:1.1;
  box-shadow:3px 4px 0 rgba(42,78,160,.18);cursor:pointer;transition:transform .08s}
.btn:active{transform:translate(2px,3px) rotate(var(--rot,0deg));box-shadow:1px 1px 0 rgba(42,78,160,.18)}
.btn.main{font-size:30px;padding:16px 34px;color:#fff;background:var(--blue);--rot:-2deg;transform:rotate(-2deg)}
.btn.sub{--rot:3deg;transform:rotate(3deg)}
.btn.red{border-color:var(--red);color:var(--red)}
.bottom .btn{white-space:nowrap}
#title .btn.main{font-size:24px;padding:16px 22px}
#title .btn.sub{font-size:18px;padding:10px 12px}
.bottom{position:fixed;left:0;right:0;bottom:0;height:33.3%;display:flex;align-items:center;justify-content:center;gap:18px;
  padding-bottom:env(safe-area-inset-bottom)}

/* title */
#title .logo{margin-top:max(5vh,calc(env(safe-area-inset-top) + 18px));text-align:center;transform:rotate(-3deg)}
#title .logo h1{margin:0;font-size:clamp(34px,10vw,52px);font-weight:400;color:var(--blue);letter-spacing:.04em;
  text-shadow:2px 2px 0 #fff,-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff}
#title .logo h1 span{color:var(--red)}
#title .logo .sub{font-size:15px;color:var(--red);margin-top:2px}
#title .card{margin-top:2vh;position:relative;display:flex;flex-direction:column;align-items:center}
#title .card img{width:min(62vw,280px);height:auto;filter:drop-shadow(3px 4px 0 rgba(42,78,160,.12));animation:bob 1.6s ease-in-out infinite}
#title .card .name{font-size:28px;margin-top:4px;color:var(--ink);background:#fff;padding:0 10px}
#title .card .name small{font-size:14px;color:var(--red);margin-left:6px}
#title .best{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:14px;font-size:16px;color:var(--red);background:#fff;padding:0 4px}
.arrow{position:absolute;right:-56px;top:20px;font-size:15px;color:var(--red);transform:rotate(12deg);white-space:nowrap}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-6px) rotate(1deg)}}

/* hud */
#hud .score{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:16px;font-size:44px;color:var(--blue);
  background:#fff;padding:0 6px;line-height:1;transform:rotate(-4deg)}
#hud .score small{font-size:16px;margin-left:2px}
#hud .pause{position:fixed;top:calc(env(safe-area-inset-top) + 10px);right:12px;width:42px;height:42px;padding:0;font-size:18px;
  display:flex;align-items:center;justify-content:center;transform:rotate(4deg)}
#jump{font-size:34px;padding:20px 54px}

/* panels */
.panel{margin-top:16vh;background:#fff;border:2.5px solid var(--blue);border-radius:20px 255px 18px 225px/225px 18px 255px 18px;
  padding:18px 30px 22px;text-align:center;transform:rotate(-1.5deg);box-shadow:4px 5px 0 rgba(42,78,160,.15);min-width:230px}
.panel h2{margin:0 0 6px;font-size:40px;font-weight:400;color:var(--red)}
.panel .big{font-size:56px;color:var(--blue);line-height:1}
.panel .big small{font-size:18px}
.panel .note{font-size:16px;color:var(--ink);margin-top:6px}
.panel .new{color:var(--red);font-size:18px;display:none;transform:rotate(-6deg)}
.panel .new.on{display:block}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="loading" class="layer on"><div class="loadtxt">よみこみちゅう<span>.</span><span>.</span><span>.</span></div></div>

<div id="title" class="layer">
  <div class="best" id="tBest">ベスト 0</div>
  <div class="logo"><h1>わんわん<span>とびいし</span></h1></div>
  <div class="card">
    <img id="tImg" alt="">
    <div class="name" id="tName">ルンルン</div>
  </div>
  <div class="bottom">
    <button class="btn sub" id="bChange">▶ケンケン</button>
    <button class="btn main" id="bStart">この子で始める</button>
  </div>
  <div class="credit">BGM：SHUNTA(OpenTracks)<br>グラフィックデザイン：姪</div>
</div>

<div id="hud" class="layer">
  <div class="score" id="hScore">0<small>マス</small></div>
  <button class="btn pause" id="bPause" aria-label="ポーズ">❚❚</button>
  <div class="bottom">
    <button class="btn main" id="jump">ジャンプ</button>
  </div>
</div>

<div id="pause" class="layer">
  <div class="panel"><h2>ひとやすみ</h2><div class="note">いつでも つづきから どうぞ</div></div>
  <div class="bottom">
    <button class="btn sub" id="bPTitle">タイトル</button>
    <button class="btn main" id="bResume">つづける</button>
  </div>
</div>

<div id="over" class="layer">
  <div class="panel">
    <h2 id="oTitle">ぽちゃん…</h2>
    <div class="big" id="oScore">0<small>マス</small></div>
    <div class="new" id="oNew">★ ベスト更新！</div>
    <div class="note" id="oBest">ベスト 0マス</div>
  </div>
  <div class="bottom">
    <button class="btn sub" id="bShare">Twitterに投稿</button>
    <button class="btn main" id="bOTitle">タイトル</button>
  </div>
</div>

// ---------- canvas ----------
const cv=document.getElementById('game'); const ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,T=60;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  T=Math.min(W/(7.0*0.9),H/11,86);

}
// grid and ground hatching are drawn once into small world-space tiles,
// then mapped onto the screen with a pattern transform (cheap per frame)
let gridPat=null,hatchPat=null,PAT_S=1;
const HATCH_W=6,HATCH_H=2;
function buildPatterns(){
  PAT_S=Math.max(32,Math.round(T*DPR));
  const S=PAT_S;
  const g=document.createElement('canvas');g.width=S;g.height=S;
  const gc=g.getContext('2d');
  gc.strokeStyle='#d3e4f0';gc.lineWidth=Math.max(1,S/T);
  gc.beginPath();
  for(const v of [0,S/2]){gc.moveTo(v+0.5,0);gc.lineTo(v+0.5,S);gc.moveTo(0,v+0.5);gc.lineTo(S,v+0.5)}
  gc.stroke();
  gridPat=ctx.createPattern(g,'repeat');
  const h=document.createElement('canvas');h.width=S*HATCH_W;h.height=S*HATCH_H;
  const hc=h.getContext('2d');
  hc.strokeStyle='rgba(226,118,78,0.17)';hc.lineWidth=1.3*S/T;hc.lineCap='round';
  let sd=12345;const rn=()=>{sd=(sd*1664525+1013904223)>>>0;return sd/4294967296};
  hc.beginPath();
  for(let j=0;j<50;j++){
    const x=rn()*HATCH_W,r=rn()*HATCH_H,l=0.35+rn()*0.75,jt=(rn()-0.5)*0.1;
    for(const ox of [-HATCH_W,0,HATCH_W])for(const oy of [-HATCH_H,0,HATCH_H]){
      hc.moveTo((x+ox)*S,(r+oy)*S);hc.lineTo((x+l+ox)*S,(r+0.18*l+jt+oy)*S);
    }
  }
  hc.stroke();
  hatchPat=ctx.createPattern(h,'repeat');
}
// maps tile pixels (world units * PAT_S) onto the screen with world point (x0,r0) at tile origin
function patMatrix(pat,x0,r0){
  const k=T/PAT_S;const o=P(x0,r0);
  pat.setTransform(new DOMMatrix([UX*k,UY*k,FX*k,FY*k,o[0],o[1]]));
}
addEventListener('resize',resize);

// projection: x = lateral (+ = upper-right), r = forward (+ = upper-left)
const UX=0.90,UY=-0.36,FX=-0.40,FY=-0.76;
let camR=0;
function P(x,r){
  const ox=W*0.5, oy=H*0.60;
  const rr=r-camR;
  return [ox+(UX*x+FX*rr)*T, oy+(UY*x+FY*rr)*T];
}
const MARGIN=3.2;   // lateral death line
const WRAP=7;       // stones wrap in [-WRAP,WRAP]

// ---------- rng ----------
let seed=1;
function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
function rr(a,b){return a+(b-a)*rnd()}

// ---------- lanes ----------
const DECO_KINDS=['g_grass1','g_grass2','g_grass1','g_grass2','g_flower1','g_flower2','g_worm','g_cocoon','g_chick'];
const DECO_H={g_flower1:1.1,g_flower2:1.1,g_grass1:0.32,g_grass2:0.32,g_worm:0.34,g_cocoon:0.3,g_chick:0.62};
let lanes=new Map(); let genTop=-1; let nextDir=1; let riverRun=0;
function makeLane(i){
  let type='safe';
  if(i>2){
    if(riverRun>0){type='river';riverRun--;}
    else{
      // after a safe lane start a new river run
      const prev=lanes.get(i-1);
      if(prev && prev.type==='safe' && !(prev.restLen<2 && rnd()<0.15)){
        const maxRun=Math.min(5,2+Math.floor(i/25));
        riverRun=1+Math.floor(rnd()*maxRun);
        type='river';riverRun--;
      }
    }
  }
  const L={i,type,stones:[],speed:0,dir:0,deco:[],restLen:0,phase:rnd()*10};
  if(type==='river'){
    const d=Math.min(i/120,1); // difficulty 0..1
    L.dir=nextDir; nextDir*=-1;
    L.speed=(0.75+d*1.5)*rr(0.75,1.25);
    let x=-WRAP+rr(0,1.2);
    const minLen=1.05-d*0.25, maxLen=1.55-d*0.35;
    const minGap=0.7+d*0.6, maxGap=1.6+d*1.2;
    while(x<WRAP-0.6){
      const len=rr(minLen,maxLen);
      L.stones.push({x:x+len/2,len,seed:Math.floor(rnd()*1e6),big:len>=1.28});
      x+=len+rr(minGap,maxGap);
    }
  }else{
    const prev=lanes.get(i-1);
    L.restLen=(prev&&prev.type==='safe')?prev.restLen+1:1;
    // decorations: mostly outside the margins, a few on the path (no collision)
    const n=1+Math.floor(rr(0,3));
    for(let k=0;k<n;k++){
      const outside=i<=2||rnd()<0.7;
      const x=outside?(rnd()<0.5?-1:1)*rr(MARGIN+0.35,5.5):rr(-2.7,2.7);
      L.deco.push({x,dr:rr(-0.22,0.22),k:DECO_KINDS[Math.floor(rnd()*DECO_KINDS.length)],flip:rnd()<0.5,s:rnd()*10});
    }
    L.deco.sort((a,b)=>b.dr-a.dr);
    // orange pencil hatching for the ground
    L.hx=rr(0,HATCH_W);
  }
  lanes.set(i,L);
}
function ensureLanes(upTo){while(genTop<upTo){genTop++;makeLane(genTop);}}
function lane(i){ensureLanes(i);return lanes.get(i)}

// ---------- player ----------
const pl={x:0,r:0,jumping:false,jt:0,fromR:0,squash:0,dead:null,deadT:0,buf:0,t:0,onStone:null};

function stoneAt(L,x){
  for(const s of L.stones){if(Math.abs(wrapD(x-s.x))<=s.len*0.5+0.08)return s;}
  return null;
}
function wrapD(d){const span=WRAP*2;while(d>WRAP)d-=span;while(d<-WRAP)d+=span;return d}

function tryJump(){
  if(state!=='play')return;
  if(pl.jumping){ if(pl.jt>JUMP_T*0.55) pl.buf=0.18; return; }
  pl.jumping=true;pl.jt=0;pl.fromR=pl.r;pl.onStone=null;

}
function land(){
  pl.jumping=false;pl.r=pl.fromR+1;pl.squash=1;

}

// ---------- drawing helpers ----------
function wob(s,i){const v=Math.sin(s*12.9898+i*78.233)*43758.5453;return v-Math.floor(v)}
function penPath(pts,close){
  ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);
  if(close)ctx.closePath();
}
function drawPaper(){
  ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
  patMatrix(gridPat,0,Math.floor(camR));
  ctx.fillStyle=gridPat;ctx.fillRect(0,0,W,H);
}
function lanePoly(i,x0,x1){
  return [P(x0,i-0.5),P(x1,i-0.5),P(x1,i+0.5),P(x0,i+0.5)];
}
const WAVE=[0,1,2,3,4,5,6].map(j=>Math.sin(j/6*Math.PI*2)*0.05);
function drawLanes(time){
  const lo=Math.floor(camR-7),hi=Math.ceil(camR+15);
  ensureLanes(hi+2);
  for(let i=hi;i>=lo;i--){
    const L=lanes.get(i);if(!L)continue;
    if(L.type==='river'){
      ctx.fillStyle='rgba(120,170,220,0.16)';
      penPath(lanePoly(i,-12,12),true);ctx.fill();
      // waves
      ctx.strokeStyle='rgba(42,78,160,0.38)';ctx.lineWidth=1.6;ctx.lineCap='round';
      ctx.beginPath();
      for(let k=0;k<2;k++){
        const rr_=i-0.22+k*0.44;
        const off=((time*L.speed*L.dir*0.6+L.phase+k*0.7)%1.2+1.2)%1.2;
        for(let x=-12+off;x<12;x+=1.2){
          for(let j=0;j<=6;j++){
            const p=P(x+j*0.066,rr_+WAVE[j]);
            if(j===0)ctx.moveTo(p[0],p[1]);else ctx.lineTo(p[0],p[1]);
          }
        }
      }
      ctx.stroke();
      // pen edges of the river
      ctx.strokeStyle='rgba(42,78,160,0.55)';ctx.lineWidth=1.3;
      const prev=lanes.get(i-1),next=lanes.get(i+1);
      if(!prev||prev.type!=='river')edgeLine(i-0.5,L.i);
      if(!next||next.type!=='river')edgeLine(i+0.5,L.i+7);
    }else{
      drawGround(L,i);
    }
  }
}
function edgeLine(r,s){
  ctx.beginPath();
  for(let x=-12,j=0;x<=12;x+=0.4,j++){const p=P(x,r+(wob(s,j)-0.5)*0.05);if(j===0)ctx.moveTo(p[0],p[1]);else ctx.lineTo(p[0],p[1])}
  ctx.stroke();
}
function drawGround(L,i){
  penPath(lanePoly(i,-12,12),true);
  ctx.fillStyle='rgba(244,170,128,0.07)';ctx.fill();
  patMatrix(hatchPat,L.hx,i-0.5);
  ctx.fillStyle=hatchPat;ctx.fill();
}
function drawObjects(test){
  const lo=Math.floor(camR-7),hi=Math.ceil(camR+15);
  for(let i=hi;i>=lo;i--){
    const L=lanes.get(i);if(!L||L.type!=='safe')continue;
    for(const d of L.deco){
      if(!test(i+d.dr))continue;
      const im=IMG[d.k];if(!im||!im.width)continue;
      const k=DECO_H[d.k]*T/im.height;
      const p=P(d.x,i+d.dr);
      ctx.save();ctx.translate(p[0],p[1]);
      if(d.k==='g_chick'){ // little head-bob every few seconds
        const ph=(time+d.s)%2.6;
        if(ph<0.5)ctx.rotate(Math.sin(ph*Math.PI*6)*0.12);
      }else if(d.k==='g_flower1'||d.k==='g_flower2'){
        ctx.rotate(Math.sin(time*1.6+d.s)*0.04);
      }
      ctx.scale(d.flip?-k:k,k);
      ctx.drawImage(im,-im.width/2,-im.height);
      ctx.restore();
    }
  }
}
function drawMargins(){
  ctx.lineWidth=1.6;
  for(const side of [-1,1]){
    const x=side*MARGIN;
    const a=P(x,camR-9),b=P(x,camR+17);
    ctx.strokeStyle='rgba(212,61,61,0.75)';
    ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();
    const a2=P(x+side*0.12,camR-9),b2=P(x+side*0.12,camR+17);
    ctx.strokeStyle='rgba(212,61,61,0.4)';
    ctx.beginPath();ctx.moveTo(a2[0],a2[1]);ctx.lineTo(b2[0],b2[1]);ctx.stroke();
    // light hatch outside
    ctx.save();
    ctx.beginPath();
    const c1=P(x,camR-9),c2=P(x,camR+17),c3=P(side*14,camR+17),c4=P(side*14,camR-9);
    ctx.moveTo(...c1);ctx.lineTo(...c2);ctx.lineTo(...c3);ctx.lineTo(...c4);ctx.closePath();
    ctx.fillStyle='rgba(212,61,61,0.05)';ctx.fill();
    ctx.restore();
  }
}
// flower images are already laid flat on the water; just scale and place them
function drawFlower(s,sx,i){
  const n=s.big?'flower_l':'flower_s';const im=IMG[n];if(!im||!im.width)return;
  const k=s.len*1.1*T/FLOWER_TREF;const A=FLOWER_ANCHOR[n];
  const p=P(sx,i+Math.sin(time*2+s.seed)*0.015);
  ctx.drawImage(im,p[0]-A.cx*k,p[1]-A.cy*k,im.width*k,im.height*k);
}
function drawStones(){
  const lo=Math.floor(camR-7),hi=Math.ceil(camR+15);
  for(let i=hi;i>=lo;i--){
    const L=lanes.get(i);if(!L||L.type!=='river')continue;
    for(const s of L.stones){
      for(const k of [-1,0,1]){
        const sx=s.x+k*WRAP*2;
        if(Math.abs(sx)>WRAP+3)continue;
        drawFlower(s,sx,i);
      }
    }
  }
}

// ---------- dog drawing ----------
function part(name,x,y,ax,ay,rot,sx,sy){
  const im=IMG[name];if(!im||!im.width)return;
  ctx.save();ctx.translate(x,y);if(rot)ctx.rotate(rot);ctx.scale(sx||1,sy||1);
  ctx.drawImage(im,-im.width*ax,-im.height*ay);ctx.restore();
}
// draws dog with feet-center at (0,0) in part pixel units; caller sets transform
function drawDog(id,t,jp,dead){
  const air=jp>0?Math.sin(jp*Math.PI):0;
  const wag=Math.sin(t*(jp>0?22:9))*(jp>0?0.45:0.28);
  const kick=jp>0?Math.sin(jp*Math.PI*2):Math.sin(t*3)*0.05;
  if(id==='run'){
    // layout follows the standing art: big head, wide flat body peeking below,
    // front paw reaching out to the left, one leg under the middle, small tail on the right
    part('run_tail',142,-100,0.2,0.92,wag-0.3,0.5,0.5);
    // legs hang from under the body (drawn first so their tops tuck behind it)
    // back pair (a bit higher and smaller), then front pair
    // original proportions; most of each leg is hidden under the body
    part('run_leg',-14,-70,0.5,0.05,0.05+kick*0.3,0.92,0.92);
    part('run_leg',80,-70,0.5,0.05,-0.1-kick*0.3,0.92,0.92);
    part('run_leg',-58,-64,0.5,0.05,0.2-kick*0.3);
    part('run_leg',38,-64,0.5,0.05,-0.05+kick*0.3);
    part('run_body',13,-96,0.5,0.5,0,1.24,1);
    part('run_head',-25,-150,0.5,0.5,Math.sin(t*2.3)*0.04+air*0.06,1,0.98);
  }else{
    part('ken_tail',96,-104,0.05,0.85,wag);
    part('ken_leg',-38,-86,0.5,0.05,-kick*0.5);
    part('ken_leg',76,-86,0.5,0.05,kick*0.5);
    part('ken_body',0,-122,0.5,0.5,0);
    part('ken_leg',-66,-76,0.5,0.05,kick*0.7);
    part('ken_leg',50,-76,0.5,0.05,-kick*0.7);
    const hr=Math.sin(t*2.1)*0.04;
    part('ken_head',0,-262,0.5,0.5,hr);
    const flap=air*0.9+Math.sin(t*3)*0.06;
    part('ken_earL',-86,-340,0.78,0.06,flap);
    part('ken_earR',90,-346,0.3,0.04,-flap);
  }
}
function drawPlayer(time){
  let x=pl.x,r=pl.r,lift=0,jp=0;
  if(pl.jumping){jp=pl.jt/JUMP_T;r=pl.fromR+jp;lift=Math.sin(jp*Math.PI)*0.55}
  const p=P(x,r);
  const k=T/250*1.75;
  // shadow
  if(pl.dead!=='fall'){
    ctx.save();ctx.translate(p[0],p[1]);ctx.scale(1,0.45);
    ctx.beginPath();ctx.arc(0,0,T*0.42*(1-lift*0.4),0,Math.PI*2);
    ctx.fillStyle='rgba(42,78,160,0.14)';ctx.fill();ctx.restore();
  }
  ctx.save();
  ctx.translate(p[0],p[1]-lift*T);
  let sx=1,sy=1,rot=0,alpha=1;
  if(pl.squash>0){sx=1+0.14*pl.squash;sy=1-0.16*pl.squash}
  if(pl.jumping){const st=Math.sin(jp*Math.PI);sx=1-0.06*st;sy=1+0.08*st;rot=-0.12*st}
  if(pl.dead==='fall'){const d=Math.min(pl.deadT/0.7,1);sy*= (1-d);sx*=1-d*0.3;alpha=1-d*0.6;ctx.translate(0,d*T*0.3)}
  if(pl.dead==='out'){const d=Math.min(pl.deadT/0.6,1);rot=Math.sign(pl.x)*d*1.2;alpha=1-d*0.7}
  ctx.globalAlpha=alpha;
  ctx.rotate(rot);ctx.scale(k*sx,k*sy);
  drawDog(CHARS[charIdx].id,pl.t,pl.jumping?jp:0,pl.dead);
  ctx.restore();ctx.globalAlpha=1;
}
function drawSplashes(dt){
  for(const s of splashes){
    s.t+=dt;const p=P(s.x,s.r);
    for(let j=0;j<3;j++){
      const tt=s.t-j*0.12;if(tt<0)continue;
      const rad=T*(0.2+tt*1.2);const a=Math.max(0,1-tt/0.9);
      ctx.save();ctx.translate(p[0],p[1]);ctx.scale(1,0.45);
      ctx.beginPath();ctx.arc(0,0,rad,0,Math.PI*2);
      ctx.strokeStyle=`rgba(42,78,160,${a*0.8})`;ctx.lineWidth=2;ctx.stroke();ctx.restore();
    }
    if(s.t<1.2){
      ctx.save();ctx.translate(p[0]+T*0.3,p[1]-T*0.9-s.t*T*0.4);ctx.rotate(-0.15);
      ctx.font=`${Math.round(T*0.42)}px ${FONT}`;
      ctx.fillStyle=`rgba(212,61,61,${1-s.t/1.2})`;ctx.fillText('ぽちゃん！',0,0);ctx.restore();
    }
  }
}
function drawOutLabel(){
  if(pl.dead!=='out')return;
  const p=P(pl.x,pl.r);
  ctx.save();ctx.translate(p[0]-T*0.6,p[1]-T*1.5);ctx.rotate(0.12);
  ctx.font=`${Math.round(T*0.42)}px ${FONT}`;
  ctx.fillStyle='rgba(212,61,61,0.95)';ctx.fillText('はみだし！',0,0);ctx.restore();
}

const FONT='"Yomogi","Zen Kurenaido","Klee One",cursive,sans-serif';
// ---------- loop ----------
let last=performance.now(),time=0;
function step(now){
  let dt=Math.min((now-last)/1000,0.05);last=now;
  if(state==='pause')dt=0;
  time+=dt;pl.t+=dt;
  // world update
  const lo=Math.floor(camR-8),hi=Math.ceil(camR+16);
  for(let i=lo;i<=hi;i++){
    const L=lanes.get(i);if(!L||L.type!=='river')continue;
    for(const s of L.stones){s.x+=L.speed*L.dir*dt;if(s.x>WRAP)s.x-=WRAP*2;if(s.x<-WRAP)s.x+=WRAP*2}
  }
  if(state==='play'){
    if(pl.buf>0)pl.buf-=dt;
    if(pl.squash>0)pl.squash=Math.max(0,pl.squash-dt*5);
    if(pl.jumping){pl.jt+=dt;if(pl.jt>=JUMP_T)land()}
    else if(pl.onStone){const L=lane(pl.r);pl.x+=L.speed*L.dir*dt}
    if(state==='play'&&Math.abs(pl.x)>MARGIN)die('out');
  }else if(state==='dying'){
    pl.deadT+=dt;
    if(pl.onStone&&pl.dead==='out'){const L=lane(pl.r);pl.x+=L.speed*L.dir*dt}
    if(pl.deadT>1.0)gameOver();
  }
  // camera
  const target=(pl.jumping?pl.fromR+pl.jt/JUMP_T:pl.r);
  camR+=(target-camR)*Math.min(1,dt*6);
  // purge old lanes
  for(const k of lanes.keys()){if(k<camR-12)lanes.delete(k)}
  // draw
  drawPaper();drawLanes(time);drawMargins();drawStones();
  if(state==='title'){drawObjects(()=>true)}
  else{
    const pr=pl.jumping?pl.fromR+pl.jt/JUMP_T:pl.r;
    drawObjects(r=>r>pr);drawPlayer(time);drawObjects(r=>r<=pr);
  }
  drawSplashes(dt);drawOutLabel();
  requestAnimationFrame(step);
}

// ---------- UI ----------
const $=id=>document.getElementById(id);
const title=$('title'),hud=$('hud'),pauseL=$('pause'),over=$('over'),hScore=$('hScore');
function show(el){[title,hud,pauseL,over].forEach(e=>e.classList.toggle('on',e===el))}
function refreshTitle(){
  const c=CHARS[charIdx];
  $('tImg').src=ASSETS[c.id+'_stand'];
  $('tName').textContent=c.name;
  $('bChange').textContent='▶'+CHARS[(charIdx+1)%CHARS.length].name;
  $('tBest').textContent='ベスト '+best+'マス';
}
function toTitle(){bgmPause();state='title';resetWorld();show(title);refreshTitle()}
function start(){resetWorld();state='play';bgmPlay(true);show(hud);hScore.innerHTML='0<small>マス</small>'}
function gameOver(){
  state='over';
  const isNew=score>best;if(isNew){best=score;saveBest(best)}
  $('oTitle').textContent=pl.dead==='fall'?'ぽちゃん…':'はみだし…';
  $('oScore').innerHTML=score+'<small>マス</small>';
  $('oNew').classList.toggle('on',isNew&&score>0);
  $('oBest').textContent='ベスト '+best+'マス';
  show(over);
}
function on(id,fn){$(id).addEventListener('pointerdown',e=>{e.preventDefault();audio();fn()})}
on('bChange',()=>{sfx('tap');charIdx=(charIdx+1)%CHARS.length;try{localStorage.setItem('patch_tobiishi_char',charIdx)}catch(e){}refreshTitle()});
on('bStart',()=>{sfx('tap');start()});
on('jump',tryJump);
on('bPause',()=>{if(state==='play'){state='pause';bgmPause();show(pauseL)}});
on('bResume',()=>{state='play';bgmPlay(false);show(hud)});
on('bPTitle',toTitle);
on('bOTitle',toTitle);
// opens the post composer in a new tab; uses click (not pointerdown) so mobile browsers allow the popup
$('bShare').addEventListener('click',()=>{
  const text=CHARS[charIdx].name+'と一緒に'+score+'マス進んだよ！ #わんわんとびいし';
  const url='https://twitter.com/intent/tweet?text='+encodeURIComponent(text)+'&url='+encodeURIComponent('https://cceight.github.io/tobiishi/');
  window.open(url,'_blank','noopener');
});
addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){e.preventDefault();audio();
    if(state==='play')tryJump();else if(state==='title')start();else if(state==='over')toTitle();}
  if(e.code==='Escape'&&state==='play'){state='pause';bgmPause();show(pauseL)}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play'){state='pause';bgmPause();show(pauseL)}});

resize();
preload().then(()=>{
  $('loading').classList.remove('on');
  toTitle();
  last=performance.now();
  requestAnimationFrame(step);
});
window.__dbg={bgm,pl,lane,JUMP_T,wrapD,lanes:()=>lanes,get state(){return state},tryJump,start};
})();
</script>
