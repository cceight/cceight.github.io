<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="関数カードを切り替えて動点Pを走らせる、数学グラフランナー。">
<meta property="og:title" content="Moving Point Run">
<meta property="og:description" content="動点Pはどこまで進めるか。関数カードを切り替えてゲートをくぐる数学グラフランナー。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://cceight.github.io/moving-point-run/">
<meta property="og:image" content="https://cceight.github.io/moving-point-run/ogp.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://cceight.github.io/moving-point-run/ogp.png">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Moving Point Run</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400;1,600&display=swap">
<style>
/* Layout: one-screen phone app — score strip / first-quadrant graph paper (point runs right from origin, camera follows upward) / hand of 5 slots (const fixed + 4 custom) with live translated formulas + clockwise cooldown. Pickup boxes open a full-screen gacha (cards or 10 s buffs/debuffs). Deliberate single light "graph notebook" look. */
:root{
  --paper:#ffffff;--panel:#f5f6f9;--line:#d5dae3;--grid:#eef1f5;--axis:#1d1d22;--ink:#1d1d22;--dim:#6b7183;
  --accent:#d98a00;--bad:#e0485e;
  --rN:#6b7183;--rR:#7a4fd6;--rE:#d98a00;--buff:#0e9f84;--chg:#7a4fd6;--debuff:#e0485e;
  --f-display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-num:"STIX Two Text","Times New Roman",serif;
  color-scheme:light;
}
/* 黒板モード */
:root[data-mode="board"]{
  --paper:#1f3b33;--panel:#264a40;--line:#4f7065;--grid:#284a40;--axis:#eef0e6;--ink:#eef0e6;--dim:#a8beb4;
  --accent:#f2d06b;--bad:#ff8f8f;
  --rN:#d4ddd8;--rR:#c9abff;--rE:#f2d06b;--buff:#8fe3c8;--chg:#c9abff;--debuff:#ff8f8f;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overflow:hidden;touch-action:manipulation}
.app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:10px;position:relative;box-sizing:border-box}
@media (min-width:360px){.app{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
i{font-style:italic}

.strip{display:flex;justify-content:space-between;align-items:center;gap:10px}
.score{font-family:var(--f-num);font-weight:600;font-size:28px}
.score small{font-size:13px;color:var(--dim);font-weight:400;margin-right:6px}
.strip-r{display:flex;align-items:center;gap:10px}
.best{font-family:var(--f-num);font-size:12px;color:var(--dim)}
.snd{border:1px solid var(--line);border-radius:3px;font-size:12px;padding:4px 8px;color:var(--dim)}
.snd.on{color:var(--ink);border-color:var(--ink)}
.stage-wrap{flex:1;min-height:0;position:relative;border:1px solid var(--line);border-radius:3px;overflow:hidden;background:var(--paper)}
canvas{display:block;width:100%;height:100%}
.now{position:absolute;right:10px;top:8px;font-family:var(--f-num);font-size:14px;color:var(--ink);background:color-mix(in srgb,var(--paper) 85%,transparent);padding:3px 7px;border-radius:3px;max-width:calc(100% - 20px);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.fxs{position:absolute;left:10px;right:10px;top:40px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.fxbar{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 12px;border:2px solid var(--c);border-radius:3px;background:color-mix(in srgb,var(--paper) 90%,transparent);color:var(--c)}
.fxbar i{position:absolute;left:0;top:0;bottom:0;background:color-mix(in srgb,var(--c) 18%,transparent);z-index:0}
.fxbar span{position:relative;z-index:1;font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:.05em}
.fxbar b{position:relative;z-index:1;font-family:var(--f-num);font-weight:600;font-size:24px;font-variant-numeric:tabular-nums}
.fxbar b small{font-size:13px;margin-left:2px}
.fxbar.end{animation:blink .5s steps(2,start) infinite}
@keyframes blink{to{opacity:.35}}

/* tutorial */
.tut{position:absolute;inset:0;z-index:12;background:var(--paper);display:flex;flex-direction:column;gap:12px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:12px}
.tut-head{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center}
.tut-head .ttl{font-family:var(--f-num);font-style:italic;font-weight:600;font-size:18px}
.tut-head .cnt{font-family:var(--f-num);font-size:13px;color:var(--dim)}
.tut-stage{flex:1;min-height:0;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.tut-stage canvas{width:100%;height:100%}
.tut-box{flex:0 0 auto;display:flex;gap:12px;align-items:stretch;border:2px solid var(--ink);border-radius:4px;padding:12px;height:228px;box-sizing:border-box;cursor:pointer;background:var(--paper)}
.face{flex:0 0 auto;align-self:flex-start;width:clamp(72px,22vw,104px);height:clamp(72px,22vw,104px);aspect-ratio:1;border:1px dashed var(--dim);border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--dim);font-size:13px;overflow:hidden;background:var(--panel)}
.face img{width:100%;height:100%;object-fit:contain}
.face:has(img){border-style:solid;border-color:var(--line)}
.face small{font-size:10px;margin-top:2px}
.tut-body{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:6px}
.tut-name{font-family:var(--f-display);font-weight:800;font-size:13px;color:var(--bad);letter-spacing:.08em}
.tut-text{flex:1;min-height:0;overflow-y:auto;font-size:14.5px;line-height:1.75}
.tut-text i{font-family:var(--f-num)}
.tut-next{align-self:flex-end;font-size:12px;color:var(--dim);animation:blink 1s steps(2,start) infinite}
.tut-r{display:flex;gap:8px;align-items:center}
.tut-skip{border:1px solid var(--line);border-radius:3px;padding:6px 12px;font-size:13px}
.speedup{position:absolute;left:0;right:0;top:38%;text-align:center;font-family:var(--f-display);font-weight:800;font-size:clamp(24px,8vw,36px);letter-spacing:.1em;color:var(--ink);pointer-events:none;opacity:0}
.speedup small{display:block;font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.1em;color:var(--dim);margin-top:4px}
.speedup.go{animation:su 1.3s ease-out}
.speedup.ready{animation:su .9s ease-out}
@keyframes su{0%{opacity:0;transform:scale(1.4)}15%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-12px)}}

.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.card{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:8px 3px 7px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:84px;min-width:0}
.card .nm{font-family:var(--f-num);font-weight:600;font-size:clamp(15px,4.6vw,21px);color:var(--c);position:relative;z-index:1;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.card .nm.small{font-size:clamp(11px,3.4vw,14px)}
.card .fx{font-family:var(--f-num);font-size:clamp(10px,2.9vw,12.5px);line-height:1.3;color:var(--dim);text-align:center;overflow-wrap:anywhere;position:relative;z-index:1;font-variant-numeric:tabular-nums}
.card .cd{position:absolute;inset:0;z-index:2;pointer-events:none}
.card.cooling .nm,.card.cooling .fx{opacity:.35;filter:grayscale(1)}
.card .cdn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--f-num);font-weight:600;font-size:20px;color:var(--ink);z-index:3;pointer-events:none}
.card.active{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c);background:color-mix(in srgb,var(--c) 8%,var(--paper))}
.card.empty{background:transparent;border-style:dashed;color:var(--line);font-size:12px}
.card.fixed::after{content:"固定";position:absolute;top:3px;left:5px;font-size:9px;color:var(--dim);letter-spacing:.1em}
.card .tag{position:absolute;top:3px;right:4px;font-size:9px;color:var(--chg);z-index:1}
.card.banned{opacity:.45}
.card.banned::before{content:"禁止";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--debuff);font-size:15px;z-index:4;background:color-mix(in srgb,var(--paper) 40%,transparent)}
.card:active{transform:scale(.96)}

.spark{position:fixed;left:0;top:0;width:0;height:0;pointer-events:none;z-index:40;color:var(--c);font-size:var(--s);line-height:0;animation:sp .5s ease-out forwards}
@keyframes sp{0%{transform:translate(0,0) scale(.3);opacity:1}70%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1) rotate(90deg);opacity:0}}

.overlay{position:absolute;inset:0;background:color-mix(in srgb,var(--paper) 94%,transparent);display:flex;flex-direction:column;justify-content:center;gap:14px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:20px;z-index:10;overflow-y:auto;overflow-x:hidden}
.title-big{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,13vw,56px);text-align:center;line-height:1.1;letter-spacing:.04em}
.logo{display:flex;flex-direction:column;align-items:center;gap:8px}
.logo svg{width:min(78%,300px);height:auto}
.logo-t{font-family:var(--f-num);font-size:clamp(34px,11vw,50px);line-height:1;letter-spacing:.01em;text-align:center}
.logo-t i{font-weight:600}
.logo-t span{font-weight:600;color:var(--bad)}
.story{position:relative;font-size:14.5px;line-height:1.95;color:var(--ink);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:12px;max-width:65ch}
.story .hint{border-bottom:1px dotted var(--dim);cursor:help;-webkit-touch-callout:none;outline:none}
.story .hint:hover,.story .hint:focus-visible,.story.on .hint{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.story .pop{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:3;background:var(--paper);border:1px solid var(--ink);border-radius:3px;padding:10px 12px;font-size:13.5px;line-height:1.85;box-shadow:0 8px 20px rgba(29,29,34,.15);opacity:0;visibility:hidden;transition:opacity .15s}
.story:has(.hint:hover) .pop,.story:has(.hint:focus-visible) .pop,.story.on .pop{opacity:1;visibility:visible}
.story .q{display:inline-block;font-family:var(--f-num);font-weight:600;margin-right:6px}
details.howto{font-size:13px;color:var(--dim)}
details.howto summary{cursor:pointer;text-align:center;color:var(--ink);font-size:14px;padding:4px}
details.howto p{line-height:1.8;margin:6px 0 0}
details.howto b{color:var(--ink)}
.modeBtn{position:absolute;top:12px;right:max(16px,env(safe-area-inset-right,0px));font-size:12px;padding:6px 10px;border-radius:3px;letter-spacing:.05em;font-family:var(--f-body);font-weight:700}
.modeBtn.to-board{background:#1f3b33;color:#eef0e6;border:1px solid #1f3b33}
.modeBtn.to-note{background:#ffffff;color:#1d1d22;border:1px solid #d5dae3}
.thumb{width:100%;border:1px solid var(--line);border-radius:3px;display:block}
.tw{display:block;text-align:center;text-decoration:none}
.title-sub{text-align:center;font-family:var(--f-num);font-size:13px;color:var(--dim);letter-spacing:.3em;margin-top:-6px}
.rules{font-size:14px;line-height:1.8;color:var(--dim)}
.rules b{color:var(--ink)}
.btn{background:var(--ink);color:var(--paper);font-weight:700;font-size:18px;border-radius:3px;padding:15px;letter-spacing:.1em}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-size:15px;padding:12px;letter-spacing:.05em}
.h2{font-family:var(--f-display);font-weight:800;font-size:24px;text-align:center}
.big{font-family:var(--f-num);font-weight:600;font-size:clamp(44px,15vw,68px);color:var(--accent);text-align:center;line-height:1}
.sub{text-align:center;color:var(--dim);font-size:13px;font-family:var(--f-num)}

/* gacha */
.overlay.gacha{background:var(--paper);justify-content:center;align-items:center}
.rays{position:absolute;left:50%;top:40%;width:900px;height:900px;margin:-450px 0 0 -450px;border-radius:50%;pointer-events:none;opacity:0;
  background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--rc) 22%,transparent) 0 8deg,transparent 8deg 20deg);
  -webkit-mask:radial-gradient(circle,#000 0 25%,transparent 62%);mask:radial-gradient(circle,#000 0 25%,transparent 62%);animation:spin 9s linear infinite}
.rays.on{opacity:1;transition:opacity .3s}
@keyframes spin{to{transform:rotate(360deg)}}
.gbox{position:relative;width:120px;height:120px;border:3px solid var(--ink);border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:800;font-size:64px;background:var(--panel);animation:shake .9s ease-in}
@keyframes shake{0%{transform:scale(.6) rotate(0)}20%{transform:scale(1) rotate(-6deg)}35%{transform:rotate(7deg)}50%{transform:rotate(-9deg)}65%{transform:rotate(11deg) scale(1.05)}80%{transform:rotate(-13deg) scale(1.1)}100%{transform:rotate(0) scale(1.25)}}
.flashw{position:fixed;inset:0;background:#fff;pointer-events:none;z-index:30;animation:fw .5s ease-out forwards}
@keyframes fw{0%{opacity:1}100%{opacity:0}}
.reveal{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:360px}
.rar{font-family:var(--f-num);font-weight:600;letter-spacing:.4em;font-size:15px;color:var(--rc);animation:pop .4s ease-out}
.gcard{width:210px;max-width:100%;border:2px solid var(--rc);border-radius:6px;background:var(--paper);padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 0 0 6px color-mix(in srgb,var(--rc) 14%,transparent),0 12px 30px color-mix(in srgb,var(--rc) 30%,transparent);animation:flip .55s ease-out}
@keyframes flip{0%{transform:perspective(600px) rotateY(90deg) scale(.8)}100%{transform:perspective(600px) rotateY(0) scale(1)}}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.gcard .gn{font-family:var(--f-num);font-weight:600;font-size:34px;color:var(--c)}
.gcard .gs{font-family:var(--f-num);font-weight:600;font-size:44px;color:var(--rc);line-height:1}
.gcard .gt{font-family:var(--f-display);font-weight:800;font-size:22px}
.gcard svg{width:100%;height:auto;max-width:170px}
.gcard .gd{font-size:13px;color:var(--dim);text-align:center;line-height:1.6}
.gcard .gd b{color:var(--ink)}
.count{font-family:var(--f-num);font-weight:600;font-size:15px;color:var(--dim)}
.count b{font-size:28px;color:var(--ink);margin:0 4px}
.swap-head{font-size:14px;text-align:center}
.swap{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%}
.swap button{border:1px solid var(--line);border-radius:3px;padding:12px 2px;font-family:var(--f-num);font-weight:600;font-size:17px;color:var(--c);background:var(--panel)}
.swap button small{display:block;font-family:var(--f-body);font-weight:500;font-size:10px;color:var(--dim);margin-top:2px}
.gacts{display:flex;flex-direction:column;gap:8px;width:100%}
@media (prefers-reduced-motion:reduce){.card:active{transform:none}.speedup.go,.speedup.ready{animation-duration:.01s}.spark{display:none}.rays{animation:none}.gbox{animation-duration:.2s}}
</style>
</head>
<body>

<div class="app" id="app">
  <div class="strip">
    <div class="score"><small><i>x</i> =</small><span id="scoreV">0.0</span></div>
    <div class="strip-r"><div class="best" id="bestV"></div><button class="snd" id="sndBtn">音 OFF</button></div>
  </div>
  <div class="stage-wrap" id="wrap">
    <canvas id="cv"></canvas>
    <div class="now" id="nowF"></div>
    <div class="fxs" id="fxs"></div>
    <div class="speedup" id="suV"></div>
  </div>
  <div class="cards" id="cards"></div>
  <div class="overlay" id="ov"></div>
  <div class="tut" id="tut" hidden>
    <div class="tut-head"><span class="ttl">Tutorial</span><span class="cnt" id="tCnt"></span><span class="tut-r"><button class="snd" id="tSnd">音 OFF</button><button class="tut-skip" id="tSkip">スキップ</button></span></div>
    <div class="tut-stage" id="tStage"><canvas id="tcv"></canvas></div>
    <div class="tut-box" id="tBox">
      <div class="face" id="tFace"></div>
      <div class="tut-body"><div class="tut-name">チュートリアルお姉さん</div><div class="tut-text" id="tText"></div><div class="tut-next" id="tNext">▼ タップで次へ</div></div>
    </div>
  </div>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const css=getComputedStyle(document.documentElement);
const C=n=>css.getPropertyValue(n).trim();
const COL={},RAR={N:{name:'NORMAL',w:50},R:{name:'RARE',w:32},E:{name:'EPIC',w:18}},CAT={buff:{name:'BUFF'},change:{name:'CHANGE'},debuff:{name:'DEBUFF'}};
let BOARD=false;try{BOARD=localStorage.getItem('mpr-board')==='1'}catch(e){}
function readTokens(){
  const cs=getComputedStyle(document.documentElement),V=n=>cs.getPropertyValue(n).trim();
  Object.assign(COL,{paper:V('--paper'),panel:V('--panel'),grid:V('--grid'),line:V('--line'),axis:V('--axis'),ink:V('--ink'),dim:V('--dim'),bad:V('--bad'),accent:V('--accent'),buff:V('--buff')});
  RAR.N.col=V('--rN');RAR.R.col=V('--rR');RAR.E.col=V('--rE');
  CAT.buff.col=V('--buff');CAT.change.col=V('--chg');CAT.debuff.col=V('--debuff');
}
document.documentElement.dataset.mode=BOARD?'board':'';readTokens();
// chalk version of a function colour: mix toward white so it reads on the board
function chalk(hex){const n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255,m=v=>Math.round(v+(255-v)*0.5);return '#'+[m(r),m(g),m(b)].map(v=>v.toString(16).padStart(2,'0')).join('')}

// ---------- functions ----------
// g(u): shape from the switch point (g(0)=0 keeps the curve connected).
// lin: slope for straight lines; otherwise ex(s) is the displayed body with s = "(x − a)" and c0 the constant g carries.
const sq=v=>Math.sqrt(Math.max(0,v));
const iflo=u=>{const n=Math.floor(u);return n*(n-1)/2+n*(u-n)};
const L=(lin,nm,col,d)=>({lin,nm,col,d,g:u=>lin*u});
const E=(nm,g,ex,c0,col,d)=>({nm,g,ex,c0,col,d});
const par=s=>s==='x'?'x':`(${s})`;
const DEFS={
  const:{...L(0,'<i>y</i> = const','#5b6b8c','今の高さで水平に進む')},
  x:L(1,'<i>x</i>','#0e9f84','まっすぐ上昇'),
  nx:L(-1,'−<i>x</i>','#e0485e','まっすぐ下降'),
  hx:L(.5,'½<i>x</i>','#2f7bd9','ゆるやかに上昇'),
  nhx:L(-.5,'−½<i>x</i>','#c0506a','ゆるやかに下降'),
  dbl:L(2,'2<i>x</i>','#0b7f6a','急角度で上昇'),
  ndbl:L(-2,'−2<i>x</i>','#b83246','急角度で下降'),
  sin:E('sin <i>x</i>',u=>Math.sin(u),s=>`sin(${s})`,0,'#7a4fd6','上から始まる波'),
  nsin:E('−sin <i>x</i>',u=>-Math.sin(u),s=>`−sin(${s})`,0,'#9a6fd6','下から始まる波'),
  cos:E('cos <i>x</i>',u=>Math.cos(u)-1,s=>`cos(${s})`,-1,'#c2418f','平らに始まり、下から入る波'),

// ---------- formula text (translated so the curve continues from the point) ----------
const r1=v=>Math.abs(v)<0.05?0:Math.round(v*10)/10;
const plus=b=>{b=r1(b);return b===0?'':(b>0?` + ${b.toFixed(1)}`:` − ${(-b).toFixed(1)}`)};
const shift=x0=>{x0=r1(x0);return x0===0?'x':(x0>0?`x − ${x0.toFixed(1)}`:`x + ${(-x0).toFixed(1)}`)};
const LIN={1:'x','-1':'−x','0.5':'½x','-0.5':'−½x',2:'2x','-2':'−2x'};
function formula(id,x0,y0,xNow){
  const D=DEFS[id];
  if(xNow!==undefined){ // past the domain end the curve runs flat: show the constant it settles at
    const u=xNow-x0,lim={asin:[1,Math.PI/2],nasin:[1,-Math.PI/2],acos:[2,Math.PI],nacos:[2,-Math.PI]}[id];
    if(lim&&u>lim[0])return `y = ${r1(y0+lim[1]).toFixed(1)}`;
  }
  if(D.lin!==undefined){if(D.lin===0)return `y = ${r1(y0).toFixed(1)}`;return `y = ${LIN[D.lin]}${plus(y0-D.lin*x0)}`}
  return `y = ${D.ex(shift(x0))}${plus(y0+D.c0)}`;
}
const mathH=s=>s.replace(/([xy])/g,'<i>$1</i>');

// ---------- sound (synthesized piano-ish notes) ----------
let AC=null,soundOn=false;try{soundOn=localStorage.getItem('fnrun-snd')==='1'}catch(e){}
const SCALE=[0,2,4,5,7,9,11,12,14,16,17,19,21,23,24]; // C4 → C6
function ensureAudio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function note(idx){
  if(!soundOn||!AC)return;
  const f=261.63*Math.pow(2,SCALE[idx]/12),t=AC.currentTime;
  const out=AC.createGain();out.gain.setValueAtTime(0.0001,t);out.gain.exponentialRampToValueAtTime(0.32,t+0.006);out.gain.exponentialRampToValueAtTime(0.0001,t+1.3);
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(f*8,t);lp.frequency.exponentialRampToValueAtTime(f*2,t+0.6);
  out.connect(lp);lp.connect(AC.destination);
  [[1,'triangle',1],[2,'sine',.35],[3,'sine',.12],[4,'sine',.06]].forEach(([m,type,a])=>{
    const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f*m;g.gain.value=a;o.connect(g);g.connect(out);o.start(t);o.stop(t+1.35);
  });
}
function setSnd(){['sndBtn','tSnd'].forEach(id=>{const b=$(id);if(!b)return;b.textContent=soundOn?'音 ON':'音 OFF';b.classList.toggle('on',soundOn)})}
const toggleSnd=()=>{soundOn=!soundOn;try{localStorage.setItem('fnrun-snd',soundOn?'1':'0')}catch(e){}if(soundOn)ensureAudio();setSnd();syncBgm()};

function tone(type,f0,f1,dur,vol,delay=0){
  if(!soundOn||!AC)return;
  const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t);if(f1!==f0)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+0.02);
}

// ---------- state ----------
let G=null,raf=0,last=0,alive=false;
let best=0;try{best=+localStorage.getItem('fnrun-best')||0}catch(e){}

function freshState(){
  return {x:0,y:0,act:{id:'const',slot:0,x0:0,y0:0},
    hand:['const','x','nx',null,null],cd:[0,0,0,0,0],cdMax:[1,1,1,1,1],
    trail:[[0,0]],path:[[0,0]],lastPathX:0,gates:[],items:[],fx:{},
    gen:{x:6,c:1.8,mode:'sparse',left:3,tunnel:null,first:true,nextItem:16},
    dead:false,paused:false,flash:0,camB:-0.8,zoom:1,t:0,lv:0,lastPassX:-99,chain:0};
}

const yAt=x=>G.act.y0+DEFS[G.act.id].g(x-G.act.x0);
const has=k=>G.fx[k]>0;
function eff(id){
  if(!id)return id;
  for(const f of ['diff','int','inv'])if(has(f)){id=FORM[f][id]||id;break}
  if(has('neg'))id=NEG[id]||id;
  return id;

// ---------- course generation (everything stays above the floor y=0) ----------
const rnd=(a,b)=>a+Math.random()*(b-a);
function pickW(list){const tot=list.reduce((s,x)=>s+x[1],0);let r=Math.random()*tot;for(const [k,w] of list){if((r-=w)<0)return k}return list[0][0]}
function genAhead(){
  const g=G.gen;
  while(g.x<G.x+VIEW_W*2+8){
    const d=g.x;
    if(g.mode==='sparse'){
      const h=Math.max(2.2,4.2-d*0.006);
      if(g.first){G.gates.push({x:6,lo:0,hi:3.6});g.first=false;g.x=6;g.c=1.8;g.left--;continue}
      const dx=rnd(3.6,5.6),nx=g.x+dx,maxD=0.85*dx;
      const c=Math.max(h/2+0.4,g.c+rnd(-maxD,maxD));
      G.gates.push({x:nx,lo:c-h/2,hi:c+h/2});
      g.x=nx;g.c=c;
      if(nx>=g.nextItem){
        G.items.push({x:nx+rnd(1.5,2.1),y:Math.max(0.9,c+rnd(-1.7,1.7))});
        g.nextItem=nx+rnd(25,35);
      }
      if(--g.left<=0){if(nx>22){g.mode='tunnel';g.tunnel=null}else g.left=2}
    }else{
      const base=Math.max(1.5,2.5-d*0.003);
      if(!g.tunnel){
        const t=pickW([['flat',1],['line',1.2],['sine',.6],['cos',.6],['stairs',.8],['parab',.8],['step',.8]]);
        const xs=g.x+rnd(2.4,3.2);
        const floorC=base/2+0.4;
        let c=g.c,dir=Math.random()<.5?1:-1,len,h=base;
        if(t==='line'){len=rnd(3,7);if(dir<0&&c-len<floorC){if(c-3<floorC)dir=1;else len=c-floorC}}
        else if(t==='sine'||t==='cos'){len=Math.PI*2*rnd(1,1.25);h=Math.max(1.9,2.6-d*0.003);c=Math.max(c,h/2+(t==='cos'?2.4:1.5))}
        else if(t==='stairs'){len=rnd(4,6);h=base+0.7}
        else if(t==='parab'){len=rnd(2.6,3.2);h=base+0.9;if(dir<0&&c-len*len/2<floorC+0.5)dir=1}
        else if(t==='step'){len=2.4;h=base+0.9;if(dir<0&&c-3.5<floorC)dir=1}
        else len=rnd(4,7);
        g.tunnel={t,xs,c,dir,len,h,i:0};
      }
      const T=g.tunnel,h=T.h;
      if(T.t==='step'){
        if(T.i===0){G.gates.push({x:T.xs,lo:Math.max(0,T.c-h/2),hi:T.c+h/2,tun:1});T.i++;continue}
        const c2=T.c+T.dir*3.5;
        G.gates.push({x:T.xs+T.len,lo:Math.max(0,c2-h/2),hi:c2+h/2,tun:1});
        g.c=c2;g.x=T.xs+T.len;g.mode='sparse';g.left=2;continue;
      }
      const st=T.t==='stairs'?0.5:0.62,u=T.i*st;
      if(u>T.len){g.x=T.xs+T.len;g.mode='sparse';g.left=Math.random()<.5?2:3;continue}
      let c;
      switch(T.t){
        case 'flat':c=T.c;break;
        case 'line':c=T.c+T.dir*u;break;
        case 'sine':c=T.c+Math.sin(u);break;
        case 'cos':c=T.c+Math.cos(u)-1;break;
        case 'stairs':c=T.c+Math.floor(u);break;
        case 'parab':c=T.c+T.dir*u*u/2;break;
      }
      G.gates.push({x:T.xs+u,lo:Math.max(0,c-h/2),hi:c+h/2,tun:1});
      g.c=c;T.i++;
    }
  }
  // trim old gates/items only when there is something to drop (avoids new arrays every frame)
  const cut=G.x-VIEW_W*2;
  if(G.gates.length&&G.gates[0].x<cut)G.gates=G.gates.filter(q=>q.x>cut);
  if(G.items.some(q=>q.gone||q.x<cut))G.items=G.items.filter(q=>q.x>cut&&!q.gone);
}

// ---------- loop ----------
// speed steps up every 30 s, capped after 6 steps (180 s); cooldowns shrink ×0.9 per step
const LV_MAX=6,LV_SEC=30;
const speed=()=>(2.5+0.5*G.lv)*(has('slow')?0.5:1);
const cdScale=()=>Math.pow(0.9,G.lv);
function loop(t){
  const dt=Math.min(0.05,(t-last)/1000);last=t;
  if(alive&&!G.dead&&!G.paused)step(dt);
  if(G){const zt=has('wide')?2:has('narrow')?0.5:1;G.zoom+=(zt-G.zoom)*Math.min(1,dt*3)}
  followCam(dt);
  if(G&&G.dead)G.flash=Math.max(0,G.flash-dt*2);
  draw(t);
  raf=requestAnimationFrame(loop);
}
function step(dt){
  G.t+=dt;
  const lv=Math.min(LV_MAX,Math.floor(G.t/LV_SEC));
  if(lv>G.lv){G.lv=lv;banner('スピードアップ<small>クールダウンダウン</small>','go')}
  for(const k in G.fx){G.fx[k]-=dt;if(G.fx[k]<=0)delete G.fx[k]}
  for(let i=0;i<5;i++){if(G.cd[i]>0){G.cd[i]=Math.max(0,G.cd[i]-dt);if(G.cd[i]===0)sparkle(i)}}
  const nx=G.x+speed()*dt;
  for(const q of G.gates){
    if(q.x>G.x&&q.x<=nx&&!q.ok){
      const yy=yAt(q.x);
      if((yy<q.lo-1e-6||yy>q.hi)&&!has('invinc')){G.x=q.x;G.y=yy;G.trail.push([G.x,G.y]);return die('gate')}
      q.ok=1;passNote();
    }
  }
  let got=null;
  for(const it of G.items){
    if(!it.gone&&it.x>G.x&&it.x<=nx&&Math.abs(yAt(it.x)-it.y)<0.95){it.gone=1;got=it}
  }
  G.x=nx;G.y=yAt(G.x);
  if(G.y<-1e-6){
    if(has('invinc')){releaseActive();G.act={id:'const',slot:-1,x0:G.x,y0:0};G.y=0} // slide on the floor
    else{G.trail.push([G.x,G.y]);return die('floor')}
  }
  G.trail.push([G.x,G.y]);
  if(G.x-G.lastPathX>=0.2){G.path.push([G.x,G.y]);G.lastPathX=G.x}
  if(G.trail.length>2400)G.trail.splice(0,G.trail.length-2400);
  genAhead();
  updateUI();
  if(got)gacha();
}
function passNote(){
  // chained if the previous gate was within 3 units of x (so the window shrinks in time as speed rises)
  G.chain=(G.x-G.lastPassX<3)?(G.chain+1)%SCALE.length:0;
  G.lastPassX=G.x;note(G.chain);
}

function releaseActive(){
  const prev=G.act.slot;
  if(prev>0&&G.hand[prev]&&!has('cd0')){const len=baseCd(G.hand[prev])*cdScale();G.cd[prev]=len;G.cdMax[prev]=len||1}
}
const CD={const:0,x:2.0,nx:2.0,hx:1.6,sin:3.0,cos:3.0,floor:3.0,hx2:3.0,nhx2:3.0,sqrt:2.5,nsqrt:2.5};
const baseCd=id=>CD[id]??2.5;
function play(slot){
  const id=G.hand[slot];
  if(!alive||G.dead||G.paused||!id||G.cd[slot]>0)return;
  if(G.act.slot===slot&&eff(id)===G.act.id)return; // same function: nothing to do
  if(slot===0&&has('noconst'))return;
  if(G.act.slot!==slot)releaseActive();
  G.act={id:eff(id),slot,x0:G.x,y0:G.y};
  updateUI(true);
}

// ---------- gacha ----------
let gTimer=0;
const CARD_W={N:1.2,R:1.0,E:0.8};
function rollCard(){
  const owned=new Set(G.hand);
  const avail=Object.keys(POOL).filter(k=>!owned.has(k));
  if(!avail.length)return null;
  // per-card weight with a gentle slope by rarity
  return pickW(avail.map(k=>[k,CARD_W[POOL[k]]]));
}
function rollItem(){
  // buffs 20% of all pulls, change+debuff 10% (each pool split evenly)
  const pool=Math.random()<2/3?['buff']:['change','debuff'];
  const ks=Object.keys(ITEMS).filter(k=>pool.includes(ITEMS[k].cat));
  return ks[Math.random()*ks.length|0];
}
function miniPlot(id){
  const g=DEFS[id].g,pts=[];let mn=0,mx=0;
  for(let u=0;u<=4.001;u+=0.05){const v=g(u);pts.push([u,v]);mn=Math.min(mn,v);mx=Math.max(mx,v)}
  const W=170,H=90,p=10,sx=(W-2*p)/4,span=Math.max(1,mx-mn),sy=(H-2*p)/span;
  const X=u=>p+u*sx,Y=v=>H-p-(v-mn)*sy;
  let d='';pts.forEach(([u,v],i)=>{d+=(i?'L':'M')+X(u).toFixed(1)+' '+Y(v).toFixed(1)});
  return `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true">
    <line x1="${p}" y1="${Y(0)}" x2="${W-p/2}" y2="${Y(0)}" stroke="${COL.line}" stroke-width="1"/>
    <line x1="${p}" y1="${p/2}" x2="${p}" y2="${H-p/2}" stroke="${COL.line}" stroke-width="1"/>
    <path d="${d}" fill="none" stroke="${DEFS[id].col}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${X(0)}" cy="${Y(0)}" r="4" fill="${COL.ink}"/></svg>`;
}

// ---------- share image ----------
function makeThumb(score,why){
  try{
    const c=document.createElement('canvas');c.width=1200;c.height=630;const g=c.getContext('2d');
    g.fillStyle=COL.paper;g.fillRect(0,0,1200,630);
    const L=70,R=1150,T=150,B=560;
    const pts=G.path,maxX=Math.max(10,G.x),maxY=Math.max(5,...pts.map(p=>p[1]));
    const sx=(R-L)/maxX,sy=Math.min(sx,(B-T)/maxY);
    const X=x=>L+x*sx,Y=y=>B-Math.max(-0.5,y)*sy;
    g.strokeStyle=COL.grid;g.lineWidth=1;
    const stepG=Math.pow(10,Math.floor(Math.log10(maxX)))/2;
    for(let x=0;x<=maxX;x+=stepG){g.beginPath();g.moveTo(X(x),T-20);g.lineTo(X(x),B);g.stroke()}
    for(let y=0;y<=(B-T)/sy;y+=stepG){g.beginPath();g.moveTo(L,Y(y));g.lineTo(R,Y(y));g.stroke()}
    g.strokeStyle=COL.axis;g.lineWidth=2;
    g.beginPath();g.moveTo(L,B);g.lineTo(R+20,B);g.moveTo(L,B);g.lineTo(L,T-30);g.stroke();
    g.strokeStyle=COL.ink;g.lineWidth=4;g.lineJoin='round';g.beginPath();
    pts.forEach(([x,y],i)=>i?g.lineTo(X(x),Y(y)):g.moveTo(X(x),Y(y)));g.stroke();
    const [ex,ey]=pts[pts.length-1];
    g.fillStyle=COL.bad;g.beginPath();g.arc(X(ex),Y(ey),11,0,Math.PI*2);g.fill();
    g.fillStyle=COL.ink;g.font='italic 600 46px "STIX Two Text","Times New Roman",serif';
    g.fillText('Moving Point',L,90);
    const w=g.measureText('Moving Point ').width;
    g.fillStyle=COL.bad;g.font='600 46px "STIX Two Text","Times New Roman",serif';g.fillText('Run',L+w,90);
    g.textAlign='right';g.fillStyle=COL.accent;g.font='600 76px "STIX Two Text","Times New Roman",serif';
    g.fillText(`x = ${score.toFixed(1)}`,R,100);
    g.fillStyle=COL.dim;g.font='700 24px "Shippori Mincho",serif';
    g.fillText(why==='floor'?'動点P、x軸の下に落ちる':'動点P、ゲートに激突',R,140);
    g.textAlign='left';g.font='italic 22px "STIX Two Text",serif';g.fillText('O',L-26,B+24);
    return c.toDataURL('image/png');
  }catch(e){return ''}
}

const cv=$('cv'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
const unit=()=>W/(VIEW_W*(G?G.zoom:1));
function resize(){
  const r=$('wrap').getBoundingClientRect();DPR=Math.min(2,devicePixelRatio||1);
  W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
}
new ResizeObserver(resize).observe($('wrap'));resize();

function followCam(dt){
  if(!G)return;
  const target=Math.max(-0.8,G.y-(H/unit())*0.45);
  G.camB+=(target-G.camB)*Math.min(1,dt*4);
}

function draw(now){
  if(!G)return;
  const U=unit();
  const camX=G.x-(W/U)*LEAD,viewW=W/U,viewH=H/U,camB=G.camB,camT=camB+viewH;
  const X=x=>(x-camX)*U, Y=y=>H-(y-camB)*U;
  ctx.fillStyle=COL.paper;ctx.fillRect(0,0,W,H);
  if(camB<0){ctx.fillStyle='rgba(224,72,94,0.08)';ctx.fillRect(0,Y(0),W,H-Y(0))}
  // grid
  ctx.lineWidth=1;
  for(let gx=Math.floor(camX);gx<=camX+viewW;gx++){
    ctx.strokeStyle=gx%5===0?COL.line:COL.grid;ctx.beginPath();ctx.moveTo(Math.round(X(gx))+.5,0);ctx.lineTo(Math.round(X(gx))+.5,Math.min(H,Y(0)));ctx.stroke();
  }
  for(let gy=Math.max(0,Math.floor(camB));gy<=camT;gy++){
    ctx.strokeStyle=gy%5===0?COL.line:COL.grid;ctx.beginPath();ctx.moveTo(0,Math.round(Y(gy))+.5);ctx.lineTo(W,Math.round(Y(gy))+.5);ctx.stroke();
  }
  ctx.strokeStyle=COL.axis;ctx.lineWidth=1.5;
  if(Y(0)<=H+2){ctx.beginPath();ctx.moveTo(0,Y(0));ctx.lineTo(W,Y(0));ctx.stroke()}
  if(X(0)>=-2&&X(0)<=W){ctx.beginPath();ctx.moveTo(X(0),Y(0));ctx.lineTo(X(0),0);ctx.stroke()}
  ctx.fillStyle=COL.dim;ctx.font='italic 12px "STIX Two Text","Times New Roman",serif';
  const xLabY=Math.min(H-4,Y(0)+13);
  for(let gx=Math.ceil(camX/5)*5;gx<=camX+viewW;gx+=5){if(gx>0)ctx.fillText(gx,X(gx)+3,xLabY)}
  for(let gy=Math.max(5,Math.ceil(camB/5)*5);gy<=camT;gy+=5){ctx.fillText(gy,4,Y(gy)-3)}
  if(X(0)>-10&&Y(0)<H)ctx.fillText('O',X(0)+3,Y(0)+13);
  // gates
  for(const q of G.gates){
    const px=X(q.x);if(px<-10||px>W+10)continue;
    ctx.fillStyle=COL.ink;ctx.globalAlpha=q.ok?0.2:1;
    const w=q.tun?4:6;
    ctx.fillRect(px-w/2,0,w,Math.max(0,Y(q.hi)));
    if(q.lo>0)ctx.fillRect(px-w/2,Y(q.lo),w,Y(0)-Y(q.lo));
  }
  ctx.globalAlpha=1;
  // pickup boxes
  for(const it of G.items){
    if(it.gone)continue;
    const px=X(it.x),py=Y(it.y+Math.sin(now/300+it.x)*0.12),s=Math.max(14,U*0.75);
    if(px<-20||px>W+20)continue;
    ctx.fillStyle=COL.paper;ctx.strokeStyle=COL.accent;ctx.lineWidth=2;
    ctx.beginPath();ctx.roundRect?ctx.roundRect(px-s/2,py-s/2,s,s,3):ctx.rect(px-s/2,py-s/2,s,s);ctx.fill();ctx.stroke();
    ctx.fillStyle=COL.accent;ctx.font=`800 ${Math.round(s*0.7)}px "Shippori Mincho",serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('？',px,py+1);ctx.textAlign='start';ctx.textBaseline='alphabetic';
  }
  // previews
  if(!G.dead&&has('preview')){
    const k=1;
    G.hand.forEach((id,i)=>{
      if(!id||G.cd[i]>0||i===G.act.slot||(i===0&&has('noconst')))return;
      const D=DEFS[eff(id)];
      ctx.strokeStyle=D.col;ctx.globalAlpha=0.35;ctx.lineWidth=1.5;ctx.beginPath();
      for(let u=0;u<=4.5*k;u+=0.05){const yy=Math.max(-1,G.y+D.g(u));const px=X(G.x+u),py=Y(Math.min(yy,camT+2));u===0?ctx.moveTo(px,py):ctx.lineTo(px,py)}
      ctx.stroke();ctx.globalAlpha=1;
    });
    ctx.strokeStyle=DEFS[G.act.id].col;ctx.globalAlpha=0.7;ctx.setLineDash([4,4]);ctx.lineWidth=2;ctx.beginPath();
    for(let u=0;u<=6*k;u+=0.05){const yy=Math.max(-1,yAt(G.x+u));const px=X(G.x+u),py=Y(Math.min(yy,camT+2));u===0?ctx.moveTo(px,py):ctx.lineTo(px,py)}
    ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;
  }
  // trail
  ctx.strokeStyle=COL.ink;ctx.lineWidth=2.5;ctx.lineJoin='round';ctx.beginPath();
  let started=false;
  for(const [tx,ty] of G.trail){if(tx<camX-1)continue;const px=X(tx),py=Y(ty);started?ctx.lineTo(px,py):(ctx.moveTo(px,py),started=true)}
  ctx.stroke();
  // point
  const pX=X(G.x),pY=Y(G.y);
  if(has('invinc')){ctx.strokeStyle=COL.buff;ctx.lineWidth=2;ctx.globalAlpha=0.5+0.3*Math.sin(now/90);ctx.beginPath();ctx.arc(pX,pY,13,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1}
  ctx.fillStyle=G.dead?COL.bad:DEFS[G.act.id].col;
  ctx.beginPath();ctx.arc(pX,pY,7,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=COL.paper;ctx.lineWidth=2;ctx.stroke();
  if(G.flash>0){ctx.fillStyle=`rgba(224,72,94,${0.25*G.flash})`;ctx.fillRect(0,0,W,H)}
}

  $('go').onclick=()=>{newGame();syncBgm()};
  $('tutBtn').onclick=startTut;
  $('modeBtn').onclick=()=>{BOARD=!BOARD;try{localStorage.setItem('mpr-board',BOARD?'1':'0')}catch(e){}document.documentElement.dataset.mode=BOARD?'board':'';readTokens();handKey='';if(G)updateUI(true);title()};
  const hint=$('hint'),story=hint.closest('.story');
  const on=e=>{if(e.pointerType!=='mouse'){e.preventDefault();story.classList.add('on')}};
  const off=()=>story.classList.remove('on');
  hint.addEventListener('pointerdown',on);
  ['pointerup','pointercancel','pointerleave'].forEach(t=>hint.addEventListener(t,off));
  hint.addEventListener('contextmenu',e=>e.preventDefault());
}

const SCRIPT=[
  ['smile','none','はーい、いらっしゃい。<br>私はチュートリアルお姉さん。<br>今日はあなたを、立派な動点Pに育ててあげるわ。<br>ケルベロスはお好き？'],
  ['doya','run','まず主役はこの点、動点Pね。原点Oから勝手に右へ走り続けるの。止まることはできないわよ。休まず進む西から東、ってやつね。'],
  ['normal','run','点が描いている線は、今セットされている関数のグラフそのもの。最初は <i>y</i> = const、つまり今の高さのまま真っすぐ水平に進むってわけ。'],
  ['smile','switch','下のカードをタップすると、関数が切り替わるわ。大事なのは、今いる場所からその形が始まること。線は途切れずに、ちゃんとつながるの。'],
  ['normal','formula','だからカードの式は、走っている間ずっと書き換わってるでしょ？「今選んだらこの式になる」っていう、平行移動した式をリアルタイムで見せてるのよ。'],
  ['doya','formula','平行移動の感覚なんて、遊んでるうちに勝手に身につくわ。お得でしょ？'],
  ['normal','cooldown','次はクールダウン。別のカードに切り替えた瞬間、手放したカードは灰色になって、時計回りに少しずつ戻ってくるわ。'],
  ['smile','cooldown','戻った瞬間はキラッと光るから見逃さないで。<br><i>y</i> = const だけはクールダウン無し、困ったらいつでも逃げ込めるわ。'],
  ['normal','crash','黒い縦の線がゲートね。隙間をくぐれば通過、壁に当たったら即アウトよ。狩りが巧いツバメほど、崖に突っ込んで死ぬらしいわ。'],
  ['normal','crash','…承太郎は短命だったわね。'],
  ['surprise','floor','それと、<i>x</i>軸より下に落ちてもアウト。上はどこまで登ってもいいけど、下は奈落だから気をつけなさい。'],
  ['smile','gate','ゲートを抜けるとピアノの音が鳴るの。<br>ドーパミン中毒のガキにふさわしいわね。<br>ゲーム画面の右上の「音」ボタンでON/OFFを切り替えられるわよ。'],
  ['normal','box','コースには、ときどきオレンジの「？」箱が浮いてるわ。触れると時間が止まって、ガチャが始まるの。<br>ガチャ好きでしょ？'],
  ['doya','box','出てくるのは新しい関数カードか、10秒間のバフ・デバフ。カードはノーマル、レア、エピックの3段階よ。私とガチャとケルベロス、どれが一番好きなのよ！'],
  ['normal','hand','手札は <i>y</i> = const の固定枠と、あと4枚まで。満杯の時に引いたら、5秒以内に入れ替える相手を選んでね。選ばなかったら、引いたカードは捨てられちゃうわ。'],
  ['smile','items','バフは緑、変化系は紫、デバフは赤で光るわ。予告線が見える「予告線表示」とか、ゲートをすり抜ける「無敵」とか、嬉しいのもたくさんあるわよ。'],
  ['surprise','items','でも「符号反転」なんか引いたら、上がるはずのカードが全部下がるようになるの。めくった瞬間の「げっ」を楽しみなさい。'],
  ['doya','items','変化系の「微分」と「積分」は、手札のカードが本当に導関数や原始関数に化けるわ。<br>sin を微分したら cos、ね？数学って面白いでしょ。'],
  ['normal','speed','それから、30秒ごとにスピードアップするわ。そのぶんクールダウンも短くなるから、手数で勝負よ。'],
  ['doya','none','どこまで進めたかは、<i>x</i> の値がそのまま記録になるわ。いい数字が出たら、ツイッターで自慢しちゃいなさい。ｘだけにね。'],
  ['smile','none','説明はここまで。<br>さあ、行ってらっしゃい、私の最高の動点Pさん！'],
];
let T={on:false,i:0,typing:false,timer:0,full:'',demo:'none',t0:0};
function startTut(){
  ensureAudio();syncBgm();hideOv();$('tText').innerHTML='';$('tut').hidden=false;T.lastX=-1;sizeTut();T.on=true;T.i=0;T.demo='';showLine();requestAnimationFrame(tutLoop);
}
function endTut(){clearInterval(T.timer);T.on=false;$('tut').hidden=true;title()}
function showLine(){
  const [face,demo,text]=SCRIPT[T.i];
  const f=$('tFace');
  f.innerHTML=FACES[face]?`<img src="${FACES[face]}" alt="">`:`顔<small>${FACE_NAME[face]}</small>`;
  f.dataset.face=face;
  if(demo!==T.demo){T.demo=demo;T.t0=performance.now();T.lastX=-1}
  $('tCnt').textContent=`${T.i+1} / ${SCRIPT.length}`;
  T.full=text;T.typing=true;$('tNext').style.visibility='hidden';
  // type out plain characters; tags appear whole
  const parts=text.match(/<[^>]+>|[^<]/g);let n=0;
  clearInterval(T.timer);
  T.timer=setInterval(()=>{n++;$('tText').innerHTML=parts.slice(0,n).join('');const ch=parts[n-1]||'';if(n%2===0&&ch.length===1&&!/[\s、。！？]/.test(ch))sfxBlip();if(n>=parts.length)finishType()},28);
}
function finishType(){clearInterval(T.timer);T.typing=false;$('tText').innerHTML=T.full;$('tNext').style.visibility='visible';$('tNext').textContent=T.i===SCRIPT.length-1?'▼ タップでタイトルへ':'▼ タップで次へ'}
$('tBox').addEventListener('click',()=>{if(!T.on)return;sfxTap();if(T.typing)return finishType();if(T.i>=SCRIPT.length-1)return endTut();T.i++;showLine()});
$('tSkip').onclick=endTut;
$('tSnd').onclick=e=>{e.stopPropagation();toggleSnd()};

const tcv=$('tcv'),tctx=tcv.getContext('2d');let TW=0,TH=0;
function sizeTut(){const r=$('tStage').getBoundingClientRect();if(!r.width)return;const d=Math.min(2,devicePixelRatio||1);TW=r.width;TH=r.height;tcv.width=TW*d;tcv.height=TH*d;tctx.setTransform(d,0,0,d,0,0)}
new ResizeObserver(sizeTut).observe($('tStage'));
function tutLoop(now){

  const c=tctx,t=(now-T.t0)/1000;
  c.fillStyle=COL.paper;c.fillRect(0,0,TW,TH);
  const U=Math.min(TW/11,TH/7),ox=U*0.8,oy=TH-U*0.8;

  c.lineWidth=1;
  for(let x=0;x<=TW/U;x++){c.strokeStyle=COL.grid;c.beginPath();c.moveTo(X(x),0);c.lineTo(X(x),oy);c.stroke()}

  c.strokeStyle=COL.axis;c.lineWidth=1.5;c.beginPath();c.moveTo(ox,oy);c.lineTo(TW,oy);c.moveTo(ox,oy);c.lineTo(ox,0);c.stroke();
  c.fillStyle=COL.dim;c.font='italic 14px "STIX Two Text",serif';c.fillText('O',ox-14,oy+15);
  const label=(txt,x,y,col,size=18,align='left')=>{c.fillStyle=col||COL.ink;c.font=`700 ${size}px "STIX Two Text","Shippori Mincho",serif`;c.textAlign=align;c.fillText(txt,x,y);c.textAlign='left'};
  const runPath=(f,maxX,col)=>{ // f(x) path, point at time-based x
    const px=Math.min(maxX,(t*1.8)%(maxX+1.5));
    c.strokeStyle=COL.ink;c.lineWidth=2.5;c.beginPath();
    for(let x=0;x<=px;x+=0.04){const yy=f(x);x===0?c.moveTo(X(x),Y(yy)):c.lineTo(X(x),Y(yy))}c.stroke();
    const py=f(px);c.fillStyle=col;c.beginPath();c.arc(X(px),Y(py),7,0,Math.PI*2);c.fill();
    return [px,py];
  };
  const D=T.demo;
  // demo sound cues: fire once when the demo's point crosses its event x
  const cross=(px,at,fn)=>{if(T.lastX<at&&px>=at)fn()};
  {const cyc={switch:[8,3,sfxTap],formula:[8,3,sfxTap],crash:[7,5,sfxDeath],floor:[7,5,sfxDeath],box:[7,5,sfxGacha],gate:[10.5,5,()=>note(0)]}[D];
   if(cyc){const px=(t*1.8)%cyc[0];if(px<T.lastX)T.lastX=-1;cross(px,cyc[1],cyc[2]);T.lastX=px}}
  if(D==='run'){runPath(x=>0,9,DEFS.const.col);label('動点P →',X(1),Y(1.2),COL.dim,16)}
  else if(D==='switch'||D==='formula'){
    const f=x=>x<3?2.6:2.6+(x-3);
    runPath(f,6.5,'transparent');
    const qx=Math.min(6.5,(t*1.8)%8),qy=f(qx);
    const cur=qx<3?'const':'x';
    c.fillStyle=DEFS[cur].col;c.beginPath();c.arc(X(qx),Y(qy),7,0,Math.PI*2);c.fill();
    if(D==='switch')label(qx<3?'y = const で水平に進む':'x のカードを選んだ！',X(qx)+12,Y(qy)-14,DEFS[cur].col,16);
    // mini hand
    const ids=['const','x','nx'],gap=10,w=Math.min((TW-40-gap*2)/3,130),h=Math.max(46,U*1.45),y0=oy-h-6,startX=(TW-(w*3+gap*2))/2;
    const pressed=qx>=3&&qx<3.5;
    ids.forEach((id,i)=>{
      const x0=startX+i*(w+gap),act=id===cur,dy=(pressed&&id==='x')?3:0;
      c.fillStyle=act?DEFS[id].col+'1c':COL.paper;c.fillRect(x0,y0+dy,w,h);
      c.strokeStyle=act?DEFS[id].col:COL.line;c.lineWidth=act?2:1;c.strokeRect(x0,y0+dy,w,h);
      const hot=D==='formula'&&id==='x';
      if(hot){c.fillStyle=COL.accent+'26';c.fillRect(x0,y0+dy,w,h);c.strokeStyle=COL.accent;c.lineWidth=2.5;c.strokeRect(x0,y0+dy,w,h)}
      label(id==='const'?'y = const':DEFS[id].nm.replace(/<\/?i>/g,''),x0+w/2,y0+dy+(D==='formula'?20:h/2+6),DEFS[id].col,D==='formula'?15:18,'center');
      if(D==='formula')label(formula(id,qx,qy),x0+w/2,y0+dy+h-12,hot?COL.ink:COL.dim,hot?Math.min(16,w/8.5):Math.min(12,w/12),'center');
      if(hot)label('▼ ここが書き換わる',x0+w/2,y0-10,COL.accent,14,'center');
      if(pressed&&id==='x'){c.strokeStyle=DEFS.x.col;c.globalAlpha=1-(qx-3)/0.5;c.lineWidth=3;c.strokeRect(x0-4,y0+dy-4,w+8,h+8);c.globalAlpha=1;label('タップ！',x0+w/2,y0-10,DEFS.x.col,15,'center')}
    });
  }
  else if(D==='cooldown'||D==='hand'){
    const ids=D==='hand'?['const','x','nx',null,null]:['const','x','nx','sin','hx2'];
    const w=Math.min((TW-40)/5-8,90),h=w*1.15,y0=TH/2-h/2;
    ids.forEach((id,i)=>{
      const x0=20+i*(w+8);
      c.strokeStyle=COL.line;c.lineWidth=1;c.setLineDash(id?[]:[4,4]);c.strokeRect(x0,y0,w,h);c.setLineDash([]);
      if(!id){label('空き枠',x0+w/2,y0+h/2,COL.line,13,'center');return}
      label(DEFS[id].nm.replace(/<\/?i>/g,'').replace('y = const','const'),x0+w/2,y0+h/2+6,DEFS[id].col,18,'center');
      if(D==='cooldown'&&i===2){
        const p=(t%3)/3;
        c.fillStyle='rgba(29,29,34,.42)';c.beginPath();c.moveTo(x0+w/2,y0+h/2);
        c.arc(x0+w/2,y0+h/2,Math.max(w,h),-Math.PI/2+p*Math.PI*2,Math.PI*1.5);c.closePath();
        c.save();c.beginPath();c.rect(x0,y0,w,h);c.clip();c.beginPath();c.moveTo(x0+w/2,y0+h/2);c.arc(x0+w/2,y0+h/2,Math.max(w,h),-Math.PI/2+p*Math.PI*2,Math.PI*1.5);c.closePath();c.fill();c.restore();
        if(p>0.92)label('✦',x0+w-6,y0+10,DEFS.nx.col,18,'center');
      }
      if(i===0&&D==='hand')label('固定',x0+12,y0+14,COL.dim,10);
    });
    if(D==='cooldown')label('時計回りに戻ってくる',20,y0+h+28,COL.dim,14);
  }
  else if(D==='gate'){
    const f=x=>2;runPath(f,9,DEFS.const.col);
    c.fillStyle=COL.ink;c.fillRect(X(5)-3,0,6,Y(3.2));c.fillRect(X(5)-3,Y(1),6,oy-Y(1));
    label('ゲート',X(5)+8,Y(4),COL.dim,14);
  }
  else if(D==='floor'){
    const f=x=>x<3?2:2-(x-3);
    const px=Math.min(5,(t*1.8)%7);
    c.strokeStyle=COL.ink;c.lineWidth=2.5;c.beginPath();for(let x=0;x<=px;x+=0.04){x===0?c.moveTo(X(x),Y(f(x))):c.lineTo(X(x),Y(f(x)))}c.stroke();
    c.fillStyle=px>=5?COL.bad:DEFS[px<3?'const':'nx'].col;c.beginPath();c.arc(X(px),Y(f(px)),7,0,Math.PI*2);c.fill();
    if(px>=5){c.fillStyle='rgba(224,72,94,.12)';c.fillRect(0,0,TW,TH);label('OUT',X(5),Y(1.5),COL.bad,26,'center')}
  }
  else if(D==='crash'){
    const px=Math.min(5,(t*1.8)%7);
    c.strokeStyle=COL.ink;c.lineWidth=2.5;c.beginPath();c.moveTo(X(0),Y(2));c.lineTo(X(px),Y(2));c.stroke();
    c.fillStyle=COL.ink;c.fillRect(X(5)-3,0,6,Y(4.8));c.fillRect(X(5)-3,Y(3),6,oy-Y(3));
    c.fillStyle=px>=5?COL.bad:DEFS.const.col;c.beginPath();c.arc(X(px),Y(2),7,0,Math.PI*2);c.fill();
    if(px>=5){c.fillStyle='rgba(224,72,94,.12)';c.fillRect(0,0,TW,TH);label('OUT',X(5),Y(5.6),COL.bad,26,'center')}
    else label('ゲート',X(5)+8,Y(5.4),COL.dim,14);
  }
  else if(D==='box'){
    const px=Math.min(5,(t*1.8)%7);
    c.strokeStyle=COL.ink;c.lineWidth=2.5;c.beginPath();c.moveTo(X(0),Y(2));c.lineTo(X(px),Y(2));c.stroke();
    c.fillStyle=DEFS.const.col;c.beginPath();c.arc(X(px),Y(2),7,0,Math.PI*2);c.fill();
    const s=U*0.9;
    if(px<5){c.fillStyle=COL.paper;c.strokeStyle=COL.accent;c.lineWidth=2;c.strokeRect(X(5)-s/2,Y(2)-s/2,s,s);label('？',X(5),Y(2)+s*0.25,COL.accent,s*0.7,'center')}
    else label('ガチャ！',X(5),Y(3.2),COL.accent,26,'center');
  }
  else if(D==='items'){
    const rows=[['予告線表示',CAT.buff.col],['微分',CAT.change.col],['符号反転',CAT.debuff.col]];
    rows.forEach(([nm,col],i)=>{
      const y=TH/2-70+i*52,w=TW-40,rem=1-((t/5+i*0.2)%1);
      c.fillStyle=col+'2e';c.fillRect(20,y,w*rem,40);c.strokeStyle=col;c.lineWidth=2;c.strokeRect(20,y,w,40);
      label(nm,32,y+27,col,17);label((rem*10).toFixed(1)+'秒',20+w-12,y+28,col,20,'right');
    });
  }
  else if(D==='speed'){
    const k=1+0.06*Math.sin(t*6);
    c.save();c.translate(TW/2,TH/2);c.scale(k,k);
    label('スピードアップ',0,-6,COL.ink,30,'center');label('クールダウンダウン',0,28,COL.dim,17,'center');c.restore();
  }
  else{
    const f=x=>2.5+Math.sin(x*1.1)*1.2;runPath(f,9,COL.bad);
  }
  requestAnimationFrame(tutLoop);
}

// ---------- font warm-up ----------
// Japanese web fonts arrive in per-character chunks; fetching a chunk the first time a canvas draws
// new characters stalls that frame. Load every canvas string up front.
function warmFonts(){
  if(!document.fonts||!document.fonts.load)return;
  const jp='？！ガチャOUTタップここが書き換わる時計回りに戻ってくる空き枠固定ゲート予告線表示微分符号反転秒スピードアップクールダウンダウン動点Pで水平に進むのカードを選んだ→、軸の下に落ちる激突';
  const math='0123456789.−+=()½¼⅙⅔√⌊⌋²³ᐟ/∫arcsinoxyOPMvgRu';
  [['700 16px "Shippori Mincho"',jp],['800 16px "Shippori Mincho"','？'],['700 16px "STIX Two Text"',math],
   ['italic 600 16px "STIX Two Text"',math],['italic 400 16px "STIX Two Text"',math],['600 16px "STIX Two Text"',math+'MovingPointRun']]
   .forEach(([f,t])=>document.fonts.load(f,t).catch(()=>{}));
}
warmFonts();

setSnd();
G=freshState();buildCards();genAhead();updateUI(true);last=performance.now();raf=requestAnimationFrame(loop);
title();
})();
</script>
