<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>QUWROFSLOT</title>
<style>
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:#ffffff;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-family:'Georgia','Yu Gothic',sans-serif;
  }
  .reels{
    display:flex;
    gap:20px;
    margin-bottom:32px;
  }
  .reel-window{
    width:220px;
    height:220px;
    border:2px solid #333;
    border-radius:8px;
    overflow:hidden;
    position:relative;
    background:#fff;
  }
  .reel-window.active{
    border-color:#c81e2c;
  }
  .reel-window img{
    position:absolute;
    top:0; left:0;
    width:100%;
    height:100%;
    object-fit:contain;
    visibility:hidden;
  }
  .reel-window img.on{
    visibility:visible;
  }
  .loading{
    height:70px;
    line-height:70px;
    font-size:20px;
    letter-spacing:0.2em;
    color:#333;
  }
  .controls{
    position:relative;
    height:70px;
    display:flex;
    justify-content:center;
  }
  .controls button{
    position:absolute;
    top:0;
    left:50%;
    transform:translateX(-50%);
    border:none;
    background:none;
    padding:0;
    cursor:pointer;
  }
  .controls button img{
    height:70px;
    display:block;
  }
  .controls .hidden{
    display:none;
  }

</style>
</head>
<body>

<div class="reels">
  <div class="reel-window" id="reel0"></div>
  <div class="reel-window" id="reel1"></div>
  <div class="reel-window" id="reel2"></div>
</div>

<div class="controls">
  <div class="loading" id="loading">LOADING…</div>
  <button id="startBtn" class="hidden"><img src="assets/start.png" alt="START"></button>
  <button id="stopBtn" class="hidden"><img src="assets/stop.png" alt="STOP"></button>
</div>

<script>
const FRAMES = [];
for(let i=0;i<10;i++){
  const d = i % 10;
  FRAMES.push(`assets/frames/frame${String(i).padStart(2,'0')}_${d}.png`);
}

const FPS = 10;
const INTERVAL = 1000 / FPS;

const reelEls = [
  document.getElementById('reel0'),
  document.getElementById('reel1'),
  document.getElementById('reel2'),
];
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');

const loadingEl = document.getElementById('loading');

const frameIndices = [0, 0, 0];
const timers = [null, null, null];
const finalDigits = [null, null, null];
let nextToStop = 0;   // 次にSTOPで止まる予定のリール番号

// 各リールに全フレームを重ねて配置し、表示する1枚だけ切り替える
// (回転中に画像の読み込み・展開が起きないようにするため)
const reelImgs = reelEls.map(el => FRAMES.map((src, i) => {
  const img = document.createElement('img');
  img.src = src;
  img.alt = '';
  if(i === 0) img.classList.add('on');
  el.appendChild(img);
  return img;
}));

function showFrame(idx, frame){
  const imgs = reelImgs[idx];
  imgs[frameIndices[idx]].classList.remove('on');
  frameIndices[idx] = frame;
  imgs[frame].classList.add('on');
}

// 画像の読み込み+展開を待つ
function waitImage(img){
  const ready = img.complete && img.naturalWidth > 0
    ? Promise.resolve()
    : new Promise(res => { img.addEventListener('load', res, {once:true}); img.addEventListener('error', res, {once:true}); });
  return ready.then(() => (img.decode ? img.decode().catch(() => {}) : null));
}

const allImgs = [
  ...reelImgs.flat(),
  startBtn.querySelector('img'),
  stopBtn.querySelector('img'),
];
Promise.all(allImgs.map(waitImage)).then(() => {
  loadingEl.classList.add('hidden');
  startBtn.classList.remove('hidden');
});

function startReelSpin(idx){
  reelEls[idx].classList.add('active');
  timers[idx] = setInterval(() => {
    showFrame(idx, (frameIndices[idx] + 1) % FRAMES.length);
  }, INTERVAL);
}

function stopReelSpin(idx){
  clearInterval(timers[idx]);
  timers[idx] = null;
  reelEls[idx].classList.remove('active');
  finalDigits[idx] = frameIndices[idx] % 10;
}

startBtn.onclick = () => {
  startBtn.classList.add('hidden');
  stopBtn.classList.remove('hidden');
  nextToStop = 0;
  for(let i=0;i<3;i++){
    showFrame(i, 0);
    startReelSpin(i);
  }
};

stopBtn.onclick = () => {
  stopReelSpin(nextToStop);
  nextToStop++;

  if(nextToStop >= 3){
    stopBtn.classList.add('hidden');
    startBtn.classList.remove('hidden');
  }
};
</script>

</body>
</html>
